function tryPlaceBuilding(btype,btx,bty){
  const def=BDEF[btype], p=G.players[PID];
  if(def.req&&!playerHasBuilding(PID,def.req)){ AudioSys.error(); flashHint('Requires '+BDEF[def.req].name); return false; }
  if(!placementValid(btype,btx,bty)){ AudioSys.error(); flashHint('Cannot build there'); return false; }
  if(p.ore<def.cost.ore||p.flux<def.cost.flux){ AudioSys.error(); flashHint('Not enough resources'); return false; }
  // Ascendant Phase 1: warp-in — no worker needed. Deduct cost, start warp timer.
  if(def.race==='ascendant'&&G.playerRace==='ascendant'){
    p.ore-=def.cost.ore; p.flux-=def.cost.flux;
    const b=spawnBuilding(btype,PID,btx,bty);
    b.warping=true; b.warpT=def.warp||8; b.hp=1;
    AudioSys.build(); flashHint(def.name+' warping in…');
    G.placing=null;
    return true;
  }
  const workers=selUnits().filter(u=>u.def.worker);
  if(!workers.length){ AudioSys.error(); return false; }
  for(const w of workers){
    const alreadyBuilding=w.ord.t==='build'||w.ord.t==='construct';
    // Bud 2026-10-11: a worker that is already building QUEUES the new job behind
    // the current one — batch placement (x5/x10/x20), Shift, and touch all stack.
    // (Old code replaced the order on desktop without Shift, so only the LAST
    // placed building ever got built.)
    if(alreadyBuilding)
      (w.bqueue=w.bqueue||[]).push({btype,btx,bty});
    else { w.bqueue=null; orderBuild(w,btype,btx,bty); }
  }
  AudioSys.build();
  // Bud's batch-build: place N then auto-exit (Shift = unlimited, as before).
  if(keys.has('Shift')) return true;
  if(G.placing&&G.placing.batch>1){
    G.placing.placed=(G.placing.placed||0)+1;
    const left=G.placing.batch-G.placing.placed;
    if(left<=0){ G.placing=null; flashHint('Batch complete ✓'); }
    else flashHint(left+' left to place');
  } else {
    G.placing=null; // single placement (default)
  }
  return true;
}

/* --- Bud's wall lines: drag to lay a line of walls, previewed live --- */
const WALL_LINE_MAX=30; // cap so nobody accidentally queues 200 walls
function wallLineCells(w0,w1){
  // Bresenham walk across the tile grid, start→end, capped at WALL_LINE_MAX.
  const x0=Math.floor(w0.x/TILE), y0=Math.floor(w0.y/TILE);
  const x1=Math.floor(w1.x/TILE), y1=Math.floor(w1.y/TILE);
  const cells=[], seen=new Set();
  const dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  const sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let err=dx-dy, x=x0, y=y0, guard=0;
  while(guard++<400){
    const k=x+','+y;
    if(!seen.has(k)){ seen.add(k); cells.push({tx:x,ty:y}); }
    if(cells.length>=WALL_LINE_MAX) break;
    if(x===x1&&y===y1) break;
    const e2=2*err;
    if(e2>-dy){ err-=dy; x+=sx; }
    if(e2<dx){ err+=dx; y+=sy; }
  }
  return cells;
}
function commitWallLine(w0,w1){
  const p=G.players[PID], cost=BDEF.wall.cost.ore;
  const cells=wallLineCells(w0,w1);
  const valid=cells.filter(c=>placementValid('wall',c.tx,c.ty));
  const afford=Math.max(0,Math.floor(p.ore/cost));
  const build=valid.slice(0,afford);
  if(!build.length){
    AudioSys.error();
    flashHint(afford<=0?'Not enough ore for walls':'No valid wall spots on that line');
    G.wallLine=null; return;
  }
  const workers=selUnits().filter(u=>u.def.worker&&!u.loadedBy);
  if(!workers.length){
    AudioSys.error(); flashHint('Select Pioneers first, then draw the wall line');
    G.wallLine=null; return;
  }
  // Distribute segments round-robin so SCVs fan out along the line.
  workers.forEach((w,i)=>{
    const mine=build.filter((_,j)=>j%workers.length===i);
    if(!mine.length) return;
    const busy=(w.ord.t==='build'||w.ord.t==='construct')&&(keys.has('Shift')||touchUsed);
    if(busy){
      for(const c of mine) (w.bqueue=w.bqueue||[]).push({btype:'wall',btx:c.tx,bty:c.ty});
    } else {
      w.bqueue=mine.slice(1).map(c=>({btype:'wall',btx:c.tx,bty:c.ty}));
      orderBuild(w,'wall',mine[0].tx,mine[0].ty);
    }
  });
  AudioSys.build();
  let msg=build.length+' walls queued ('+(build.length*cost)+' ore)';
  if(valid.length>build.length) msg+=' — '+(valid.length-build.length)+' skipped (not enough ore)';
  else if(cells.length>valid.length) msg+=' — '+(cells.length-valid.length)+' blocked';
  flashHint(msg);
  G.placing=null; G.wallLine=null;
}
function drawWallLinePreview(w0,w1){
  const p=G.players[PID], cost=BDEF.wall.cost.ore;
  const cells=wallLineCells(w0,w1);
  const affordable=Math.max(0,Math.floor(p.ore/cost));
  let built=0;
  for(const c of cells){
    const ok=placementValid('wall',c.tx,c.ty);
    const good=ok&&built<affordable;
    if(good) built++;
    ctx.fillStyle=good?'rgba(80,255,120,0.35)':'rgba(255,60,60,0.35)';
    ctx.fillRect(c.tx*TILE,c.ty*TILE,TILE,TILE);
    ctx.strokeStyle=good?'#3dff5e':'#ff4d4d'; ctx.lineWidth=2;
    ctx.strokeRect(c.tx*TILE,c.ty*TILE,TILE,TILE);
  }
  // Live count + cost label at the line midpoint.
  const validCount=cells.filter(c=>placementValid('wall',c.tx,c.ty)).length;
  const n=Math.min(validCount,affordable);
  const label=n+' walls — '+(n*cost)+' ore'+(cells.length>=WALL_LINE_MAX?' (max)':'');
  ctx.font='bold 14px sans-serif';
  const tw=ctx.measureText(label).width;
  const sx=(w0.x+w1.x)/2, sy=(w0.y+w1.y)/2;
  ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillRect(sx-tw/2-6,sy-34,tw+12,22);
  ctx.fillStyle=n>0?'#ffffff':'#ff9090'; ctx.textAlign='center';
  ctx.fillText(label,sx,sy-18);
  ctx.textAlign='left';
}

/* --- Keyboard --- */
window.addEventListener('keydown',e=>{
  if(e.key==='Shift'||e.key==='Control') { keys.add(e.key); e.preventDefault(); return; }
  if(!G.running) return;
  const k=e.key.toUpperCase();
  if(k==='F1'){ showHelp=!showHelp; e.preventDefault(); return; }
  if(G.over) return;
  keys.add(k);
  if(k==='ESCAPE'){
    if(showHelp) showHelp=false;
    else if(G.placing){ G.placing=null; G.wallLine=null; }
    else if(G.landing){ G.landing=null; flashHint('Landing cancelled'); }
    else if(G.attackMoveArmed) G.attackMoveArmed=false;
    else if(G.nukeArmed) G.nukeArmed=null;
    else if(G.allyCmd&&G.allyCmd.open) G.allyCmd.open=false; // Bud 2026-10-11: Esc dismisses the ally menu
    else clearSelection();
    return;
  }
  if(k==='P'){ togglePause(); return; }
  if(k==='M'){ flashHint(AudioSys.toggleMute()?'Muted':'Sound on'); return; }
  if(k==='+'||k==='='){ G.speed=G.speed>=2?1:2; flashHint('Speed x'+G.speed); return; }
  if(k==='-'){ G.speed=1; flashHint('Speed x1'); return; }
  // Control groups.
  if(/^[0-9]$/.test(k)){
    if(keys.has('Control')){
      G.groups[k]=selUnits().map(u=>u.id);
      flashHint('Group '+k+' assigned ('+G.groups[k].length+')');
    } else {
      const ids=G.groups[k]||[];
      const now=performance.now();
      clearSelection();
      let cx=0,cy=0,n=0;
      for(const id of ids){ const u=G.units.find(u=>u.id===id&&!u.dead&&!u.loadedBy);
        if(u&&u.owner===PID){ G.sel.push(u); cx+=u.x; cy+=u.y; n++; } }
      if(n){ if(now-(G.lastTap[k]||0)<450) centerOn(cx/n,cy/n);
        G.lastTap[k]=now; AudioSys.select(); }
    }
    e.preventDefault(); return;
  }
  if(keys.has('Control')||keys.has('Meta')) return; // don't hijack browser shortcuts
  // Unit orders.
  const us=selUnits();
  if(k==='S'&&us.length){ for(const u of us) orderStop(u); return; }
  if(k==='H'&&us.length){ for(const u of us) orderHold(u); return; }
  if(k==='A'&&us.length&&us.some(u=>u.def.dmg>0)){ G.attackMoveArmed=true; flashHint('Attack-move: left-click target'); return; }
  // Contextual command-card hotkeys.
  const cmds=getCommands();
  const c=cmds.find(c=>c.hotkey===k);
  if(c){ c.act(); e.preventDefault(); }
});
window.addEventListener('keyup',e=>{
  keys.delete(e.key.toUpperCase());
  if(e.key==='Shift') keys.delete('Shift');
  if(e.key==='Control') keys.delete('Control');
});

/* --- Minimap interaction --- */
function mmToWorld(e){
  const r=mmCanvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width, my=(e.clientY-r.top)/r.height;
  return { x:clamp(mx*MAP_PX,0,MAP_PX), y:clamp(my*MAP_PX,0,MAP_PX) };
}
mmCanvas.addEventListener('mousedown',e=>{ mmDrag=true; const w=mmToWorld(e); centerOn(w.x,w.y); });
// Finger on the minimap pans the camera (the minimap only had mouse handlers before).
function mmTouch(e){ const t=e.touches[0]||e.changedTouches[0]; if(!t) return; const w=mmToWorld(t); centerOn(w.x,w.y); e.preventDefault(); }
mmCanvas.addEventListener('touchstart',mmTouch,{passive:false});
mmCanvas.addEventListener('touchmove',mmTouch,{passive:false});
window.addEventListener('mousemove',e=>{ if(mmDrag){ const w=mmToWorld(e); centerOn(w.x,w.y); } });
window.addEventListener('mouseup',()=>{ mmDrag=false; });

/* ------------------------------ 14. Command card ---------------------------- */
let showHelp=false, hintText='', hintT=0;
function flashHint(t,dur){ hintText=t; hintT=dur||2.6; }
function cancelBuildingPlacement(){
  G.placing=null; G.wallLine=null;
  G.cmdMenuOpen=false;
}
function beginBuildingPlacement(btype){
  const def=BDEF[btype];
  if(def.req&&!playerHasBuilding(PID,def.req)){
    AudioSys.error(); flashHint('Requires '+BDEF[def.req].name); return false;
  }
  G.cmdMenuOpen=false;
  G.placing={btype, batch:1, placed:0}; // Bud's batch-build: x1/x5/x10/x20
  return true;
}

function selectArmy(){
  clearSelection();
  for(const u of G.units){
    if(u.dead||u.loadedBy||u.owner!==PID||u.def.worker||u.def.civilian) continue;
    G.sel.push(u);
  }
  G.placing=null; G.wallLine=null; G.attackMoveArmed=false; G.rallyArmed=null; G.nukeArmed=null;
  if(G.sel.length){ AudioSys.select(); flashHint('Army selected — '+G.sel.length+' units'); }
  else flashHint('No combat units available');
}
function getCommands(){
  const cmds=[];
  const us=selUnits(), bs=selBuildings();
  const push=(id,label,hotkey,tip,act,section)=>cmds.push({id,label,hotkey,tip,act,section});
  push('select_army','Select\nArmy','','Select every combat unit — excludes workers and civilians',selectArmy);
  if(G.placing){
    push('cancel','Cancel','','Exit building placement',cancelBuildingPlacement);
    // Bud's batch-build: pick how many to place before auto-exiting.
    // (Walls use drag-lines instead — Bud's call — so no batch buttons there.)
    if(G.placing.btype!=='wall'){
      for(const n of [1,5,10,20]){
        const active=G.placing.batch===n;
        push('batch'+n,(active?'▶ ':'')+'x'+n,'',
          'Place '+n+' '+(BDEF[G.placing.btype]?BDEF[G.placing.btype].name:'')+(n>1?'s':'')+' then stop'+(active?' (selected)':''),
          ()=>{ G.placing.batch=n; G.placing.placed=0; AudioSys.select();
                flashHint('Batch x'+n+' — tap '+n+' spot'+(n>1?'s':'')); });
      }
    }
    return cmds;
  }
  if(us.length&&us.every(u=>u.def.worker)){
    if(G.playerRace==='ascendant'){
      // Ascendant Phase 1: warp-in buildings, no worker construction needed.
      push('b_supplyspire','Supply\nSpire','Q','Supply Spire — 100 ore, +8 supply',
        ()=>{ beginBuildingPlacement('supplyspire'); });
      push('b_bladesanctum','Blade\nSanctum','W','Blade Sanctum — 175 ore 25 flux. Warps in Shards, Prisms, Eclipses, Sentinels, Oracles',
        ()=>{ beginBuildingPlacement('bladesanctum'); });
      push('b_skyreliquary','Sky\nReliquary','E','Sky Reliquary — 200 ore 125 flux. Requires Blade Sanctum. Warps in Lancers, Monoliths, Judicators',
        ()=>{ beginBuildingPlacement('skyreliquary'); });
      // Ascendant Phase 2.
      push('b_resovault','Resonance\nVault','R','Resonance Vault — 200 ore 100 flux. Requires Blade Sanctum. Researches Aegis Plating, Hard-Light Edge, Resonance Flow',
        ()=>{ beginBuildingPlacement('resovault'); });
      push('b_aegispylon','Aegis\nPylon','T','Aegis Pylon — 125 ore 25 flux. Static defense that shares shield regen with nearby Ascendant buildings',
        ()=>{ beginBuildingPlacement('aegispylon'); });
      push('b_warpconduit','Warp\nConduit','Y','Warp Conduit — 150 ore 75 flux. Requires Blade Sanctum. Forward warp-in point for reinforcements',
        ()=>{ beginBuildingPlacement('warpconduit'); });
    } else if(G.playerRace==='swarm'){
      // SWARM worker menu (Episode 2): Drones mutate into living structures.
      push('b_nestmound','Nest\nMound','Q','Nest Mound — 100 ore, +8 supply',
        ()=>{ beginBuildingPlacement('nestmound'); },'Economy');
      push('b_spawningpit','Spawning\nPit','W','Spawning Pit — 150 ore 50 flux. Hatches Skitters, Spitters, Burrowers, Maulers',
        ()=>{ beginBuildingPlacement('spawningpit'); },'Production');
      push('b_skyspire','Sky\nSpire','E','Sky Spire — 150 ore 100 flux. Requires Spawning Pit. Hatches Harpies, Shrikes',
        ()=>{ beginBuildingPlacement('skyspire'); },'Production');
      push('b_spinecolony','Spine\nColony','T','Spine Colony — 100 ore 25 flux. Static defense, strong vs ground',
        ()=>{ beginBuildingPlacement('spinecolony'); },'Defense');
      push('b_sporecolony','Spore\nColony','R','Spore Colony — 100 ore 50 flux. Static anti-air defense',
        ()=>{ beginBuildingPlacement('sporecolony'); },'Defense');
      push('b_hive','Swarm\nHive','Y','Swarm Hive — 400 ore. Expansion base, hatches Drones',
        ()=>{ beginBuildingPlacement('hive'); },'Economy');
    } else {
    push('b_depot','Supply\nDepot','Q','Supply Depot — 100 ore, +8 supply',
      ()=>{ beginBuildingPlacement('depot'); },'Economy');
    push('b_barracks','Barracks','W','Barracks — 150 ore. Trains infantry',
      ()=>{ beginBuildingPlacement('barracks'); },'Production');
    push('b_factory','Factory','E','Factory — 200 ore 100 flux. Trains vehicles',
      ()=>{ beginBuildingPlacement('factory'); },'Production');
    push('b_starport','Starport','R','Starport — 150 ore 100 flux. Trains aircraft',
      ()=>{ beginBuildingPlacement('starport'); },'Production');
    push('b_turret','Defense\nTurret','T','Defense Turret — 125 ore 25 flux. Static defense, hits air & ground',
      ()=>{ beginBuildingPlacement('turret'); },'Defense');
    push('b_missile','Missile\nTurret','P','Missile Turret — 150 ore 75 flux. Dedicated anti-air, weak vs ground',
      ()=>{ beginBuildingPlacement('missile'); },'Defense');
    push('b_wall','Wall','B','Wall — 25 ore. Blocks ground movement (not air). Upgradeable to 3 tiers',
      ()=>{ beginBuildingPlacement('wall'); },'Defense');
    push('b_bunker','Bunker','Y','Bunker — 100 ore. Requires Barracks; holds 4 infantry',
      ()=>{ beginBuildingPlacement('bunker'); },'Defense');
    push('b_heavyfactory','Heavy\nFactory','U','Heavy Factory — 300 ore 200 flux. Requires Factory; trains Siege Tanks',
      ()=>{ beginBuildingPlacement('heavyfactory'); },'Production');
    push('b_missilesilo','Missile\nSilo','I','Missile Silo — 400 ore 300 flux. Requires Starport',
      ()=>{ beginBuildingPlacement('missilesilo'); },'Production');
    push('b_techlab','Tech Lab','O','Tech Lab — 200 ore 100 flux. Researches combat upgrades',
      ()=>{ beginBuildingPlacement('techlab'); },'Production');
    } // end Concord worker menu (Ascendant branch above)
    // Touch-friendly gather orders (no right-click on phones): send workers
    // to the nearest visible resource of that type.
    push('mine','Mine\nOre','','Send workers to the nearest ore field',()=>{
      const wus=us.filter(u=>u.def.worker);
      const ore=nearestVisibleResource('ore');
      if(ore){ for(const u of wus) orderGather(u,ore); AudioSys.order(); }
      else flashHint('No ore field in sight — explore first!');
    });
    push('flux','Gather\nFlux','','Send workers to the nearest flux geyser',()=>{
      const wus=us.filter(u=>u.def.worker);
      const g=nearestVisibleResource('flux');
      if(g){ for(const u of wus) orderGather(u,g); AudioSys.order(); }
      else flashHint('No flux geyser in sight — explore first!');
    });
  }
  if(bs.length===1&&bs[0].owner===PID&&bs[0].progress>=1&&bs[0].def.trains){
    for(const t of bs[0].def.trains){
      const d=UDEF[t];
      push('t_'+t, d.name, TRAIN_KEYS[t],
        `${d.name} — ${d.cost.ore} ore ${d.cost.flux} flux, ${d.bt}s`+(d.vehicle?' — 🛡️ Strong vs defenses (+50%)':''),
        ((b,tt)=>()=>{ if(!trainUnit(b,tt)) AudioSys.error(); })(bs[0],t));
    }
    // Rally point as a button (Bud: no hidden right-click flow on touch).
    push('rally','Set\nRally','','Tap, then tap the map: new units walk there',()=>{
      G.rallyArmed=bs[0]; G.attackMoveArmed=false;
      flashHint('Rally: tap the map where new units should go');
    });
    // Repeat production: infinitely rebuild the last queued unit (Bud request).
    push('repeat','Repeat\n'+(bs[0].repeat?'ON':'OFF'),'','Toggle: keep making the last trained unit non-stop',()=>{
      const b=bs[0]; b.repeat=!b.repeat;
      if(b.repeat&&!b.repeatType) b.repeatType=b.queue[b.queue.length-1]||null;
      if(b.repeat&&!b.repeatType){ b.repeat=false; flashHint('Queue a unit first, then enable Repeat'); AudioSys.error(); }
      else { AudioSys.select(); flashHint('Repeat production '+(b.repeat?'ON':'OFF')); }
    });
  }
  // Research: Tech Lab (Concord) or Resonance Vault (Ascendant, Phase 2).
  if(bs.length===1&&bs[0].owner===PID&&(bs[0].type==='techlab'||bs[0].type==='resovault')&&bs[0].progress>=1){
    const lab=bs[0];
    if(lab.research){
      const d=UPG[lab.research];
      push('researching','Research '+Math.floor(lab.researchProgress*100)+'%','','Researching '+d.name,()=>flashHint(d.name+' '+Math.floor(lab.researchProgress*100)+'% complete'));
    } else {
      for(const id of Object.keys(UPG)){
        const d=UPG[id];
        // Race-gated: Ascendant upgrades only at the Vault, Concord only at the Lab.
        if(d.race==='ascendant'&&lab.type!=='resovault') continue;
        if(!d.race&&lab.type!=='techlab') continue;
        if(hasUpgrade(PID,id)||(d.req&&!hasUpgrade(PID,d.req))) continue;
        push('upg_'+id,d.name,d.hotkey,`${d.name}${d.desc?' ('+d.desc+')':''} — ${d.cost.ore} ore ${d.cost.flux} flux, ${d.time}s`,()=>{ if(!startResearch(lab,id)){ AudioSys.error(); flashHint('Not enough resources'); } });
      }
    }
  }
  if(bs.length===1&&bs[0].owner===PID&&bs[0].type==='missilesilo'&&bs[0].progress>=1){
    const b=bs[0];
    if(b.nukeReady) push('launch_nuke','Launch\nNuke','N','Target anywhere — 500 damage in an 8-tile radius',()=>armNuke(b));
    else if(b.nukeBuilding) push('nuke_building','Nuke '+Math.floor(b.nukeProgress*100)+'%','','Missile construction in progress (60 seconds)',()=>flashHint('Nuclear missile '+Math.floor(b.nukeProgress*100)+'% complete'));
    else push('build_nuke','Build\nNuke','N','Nuclear Missile — 500 ore 500 flux, 60 seconds',()=>{ if(!startNukeBuild(b)){ AudioSys.error(); flashHint('Need 500 ore and 500 flux'); } });
  }
  if(bs.length===1&&bs[0].owner===PID&&bs[0].type==='bunker'&&bs[0].cargo.length){
    push('bunker_unload','Unload ('+bs[0].cargo.length+')','U','Unload all infantry from the bunker',()=>unloadBunker(bs[0]));
  }
  // Bud 2026-10-11: StarCraft-style lift-off. Concord Command Centers can take
  // to the air and land somewhere new. (Ascendant warp instead — no lift-off.)
  if(bs.length===1&&bs[0].owner===PID&&(bs[0].type==='command'||bs[0].type==='heartspire'||bs[0].type==='hive')&&bs[0].progress>=1){
    if(bs[0].type==='command'&&G.playerRace!=='ascendant'){ push('liftoff','Lift\nOff 🚀','L','Lift off: this Command Center becomes a slow flying unit. Move it, then land it somewhere new with the Land button.',()=>liftOffCC(bs[0])); }
    // Bud 2026-10-12: worker upgrades at Command Center from the start.
    const cc=bs[0];
    for(const id of ['harv1','harv2','harv3','constr']){
      const d=UPG[id];
      if(hasUpgrade(PID,id)||(d.req&&!hasUpgrade(PID,d.req))) continue;
      push('upg_'+id,d.name,d.hotkey,`${d.name}${d.desc?' ('+d.desc+')':''} — ${d.cost.ore} ore ${d.cost.flux} flux, ${d.time}s`,()=>{
        if(!startResearch(cc,id)){ AudioSys.error(); flashHint('Not enough resources'); }
      });
    }
  }
  // Ascendant Phase 2: Warp Conduit — toggle forward reinforcement. When ON,
  // newly trained Ascendant units warp in at this conduit instead of their barracks.
  if(bs.length===1&&bs[0].owner===PID&&bs[0].type==='warpconduit'&&bs[0].progress>=1&&!bs[0].warping){
    const wc=bs[0];
    push('wcreinf','Reinforce\n'+(wc.reinforce?'ON':'OFF'),'','Toggle: new Ascendant units warp in here instead of at their production building',()=>{
      wc.reinforce=!wc.reinforce; AudioSys.select();
      flashHint('Warp reinforcement '+(wc.reinforce?'ON — units arrive here':'OFF'));
    });
  }
  { // Garrisoning a bunker was right-click only; this button does the same for touch/mouse users.
    const inf=us.filter(u=>INFANTRY_TYPES.has(u.type)&&!u.def.worker&&!u.loadedBy&&!u.dead);
    if(inf.length&&G.buildings.some(b=>!b.dead&&b.owner===PID&&b.type==='bunker'&&b.progress>=1&&b.cargo.length<b.def.capacity)){
      push('garrison','Enter\nBunker','','Put the selected infantry into the nearest Bunker with room',()=>{
        let n=0;
        for(const u of inf){
          const bk=G.buildings.filter(b=>!b.dead&&b.owner===PID&&b.type==='bunker'&&b.progress>=1&&b.cargo.length<b.def.capacity)
            .sort((a,b)=>dist2(a.cx,a.cy,u.x,u.y)-dist2(b.cx,b.cy,u.x,u.y))[0];
          if(!bk) break;
          if(garrisonBunker(bk,u)) n++;
        }
        if(n){ AudioSys.order(); flashHint(n+' infantry entered the bunker'); } else { AudioSys.error(); flashHint('No bunker with room'); }
      });
    }
  }
  // Bud's walls: upgrade a finished wall through 3 tiers (more HP per level).
  if(bs.length===1&&bs[0].owner===PID&&bs[0].type==='wall'&&bs[0].progress>=1){
    const w=bs[0], lv=w.wallLevel||1;
    if(lv<3){
      const up=WALL_TIERS[lv+1], c=up.cost;
      push('wall_up','Upgrade\n'+up.name,'','Upgrade to '+up.name+' ('+up.hp+' HP) — '+c.ore+' ore'+(c.flux?' '+c.flux+' flux':''),
        ()=>{
          const p=G.players[PID];
          if(p.ore<c.ore||p.flux<c.flux){ AudioSys.error(); flashHint('Not enough resources'); return; }
          p.ore-=c.ore; p.flux-=c.flux;
          w.wallLevel=lv+1;
          w.def=Object.assign({}, BDEF.wall, {name:up.name, hp:up.hp});
          const gain=up.hp-w.maxhp; w.maxhp=up.hp; w.hp=Math.min(w.maxhp,w.hp+gain);
          AudioSys.build(); flashHint('Wall upgraded: '+up.name);
        });
    }
  }
  const stimUnits=us.filter(u=>INFANTRY_TYPES.has(u.type)&&!u.def.worker);
  if(stimUnits.length&&hasUpgrade(PID,'stim')){
    push('stim','Stim Pack','X','Spend 10 HP for +50% attack speed for 10 seconds',()=>{
      let n=0;
      for(const u of stimUnits) if(u.hp>10&&u.stimT<=0){ u.hp-=10; u.stimT=10; n++; for(let i=0;i<5;i++) addParticle(u.x,u.y,rand(-24,24),rand(-35,-8),0.35,2,'#ff784d',0); }
      if(n){ AudioSys.blip(360,720,0.16,'square',0.25); flashHint('Stim Pack active — '+n+' infantry'); } else { AudioSys.error(); flashHint('Infantry need more than 10 HP'); }
    });
  }
  if(us.some(u=>u.type==='bulwark')&&hasUpgrade(PID,'siegemode')){
    const anyMobile=us.some(u=>u.type==='bulwark'&&!u.siege&&u.deploying<=0);
    push('siege', anyMobile?'Siege\nMode':'Unsiege','E','Toggle deployed artillery mode',()=>{
      for(const u of us) if(u.type==='bulwark'&&u.deploying<=0){
        u.deploying=1.4; orderStop(u); for(let i=0;i<8;i++)
          addParticle(u.x,u.y,rand(-40,40),rand(-40,40),0.4,3,'#ffcc66',0); }
    });
  }
  if(us.some(u=>u.type==='heron'&&u.cargo.length)){
    push('unload','Unload','U','Unload all passengers here',()=>{
      for(const u of us) if(u.type==='heron'&&u.cargo.length){
        u.ord={t:'unloadmove'}; setPathTo(u,u.x,u.y+48); }
    });
  }
  // Bud 2026-10-11: landing a lifted Command Center. Tap Land, then tap the map.
  if(us.length===1&&us[0].type==='ccfly'&&us[0].owner===PID){
    push('landcc','Land 🛬','L','Tap, then tap a clear spot: set the Command Center back down',()=>{
      G.landing=us[0]; G.attackMoveArmed=false; G.rallyArmed=null;
      flashHint('Land: tap a clear spot for your Command Center'); AudioSys.select();
    });
  }
  const repairTarget=[...us,...bs].find(e=>e.owner===PID&&e.hp<e.maxhp&&(e.kind==='building'||MECH_TYPES.has(e.type)));
  if(repairTarget&&G.units.some(u=>!u.dead&&u.owner===PID&&u.def.worker)){
    push('repair','Repair','V','Send up to 3 nearby Pioneers to repair this unit or building',()=>{
      const tx=repairTarget.kind==='unit'?repairTarget.x:repairTarget.cx, ty=repairTarget.kind==='unit'?repairTarget.y:repairTarget.cy;
      const workers=G.units.filter(u=>!u.dead&&u.owner===PID&&u.def.worker&&!u.loadedBy).sort((a,b)=>dist2(a.x,a.y,tx,ty)-dist2(b.x,b.y,tx,ty)).slice(0,3);
      for(const w of workers) orderRepair(w,repairTarget);
      if(workers.length){ AudioSys.order(); flashHint(workers.length+' Pioneer'+(workers.length===1?'':'s')+' repairing'); }
    });
  }
  if(us.length){
    push('stop','Stop','S','Stop all orders',()=>{ for(const u of us) orderStop(u); });
    push('hold','Hold','H','Hold position, engage in range',()=>{ for(const u of us) orderHold(u); });
    if(us.some(u=>u.def.dmg>0))
      push('attack',G.attackMoveArmed?'Cancel\nAttack':'Attack','A','Attack-move: engage on the way. Tap again to cancel.',()=>{
        // Tapping Attack again disarms it (on touch there is no Esc / right-click to back out of an armed order).
        G.attackMoveArmed=!G.attackMoveArmed;
        if(G.attackMoveArmed){ G.rallyArmed=null; flashHint('Attack: tap the ground to attack-move, or tap an enemy to focus it'); }
      });
  }
  return cmds;
}
function clickCommandButton(sx,sy){
  // Orders menu open: rows first, then outside-tap dismissal.
  if(G.cmdMenuOpen){
    if(G.cmdMenuRects) for(const r of G.cmdMenuRects){
      if(sx>=r.x&&sx<=r.x+r.w&&sy>=r.y&&sy<=r.y+r.h){
        G.cmdMenuOpen=false; r.cmd.act(); AudioSys.select(); return true;
      }
    }
    // Swallow the tap so it never falls through to the map. While placing,
    // tapping the dimmed area is an intentional cancel gesture on phones.
    if(G.placing) cancelBuildingPlacement();
    else G.cmdMenuOpen=false;
    return true;
  }
  if(G.cmdMenuBtn){
    const b=G.cmdMenuBtn;
    if(sx>=b.x&&sx<=b.x+b.w&&sy>=b.y&&sy<=b.y+b.h){
      G.cmdMenuOpen=true; AudioSys.select(); return true;
    }
  }
  if(!G.cmdRects) return false;
  for(const r of G.cmdRects){
    if(sx>=r.x&&sx<=r.x+r.w&&sy>=r.y&&sy<=r.y+r.h){ r.cmd.act(); return true; }
  }
  return false;
}

      ctx.fillStyle='rgba(84,232,255,'+(0.25+0.35*wp).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(x+0.5*w,y+0.5*w,w*0.14*(0.8+0.2*wp),0,TAU); ctx.fill();
      P([[0.5,0.1],[0.57,0.24],[0.43,0.24]],'#ffe9b0'); // anchor crystals
      P([[0.5,0.9],[0.57,0.76],[0.43,0.76]],'#8a6a2a');
      P([[0.1,0.5],[0.24,0.43],[0.24,0.57]],'#caa14e');
      P([[0.9,0.5],[0.76,0.43],[0.76,0.57]],'#caa14e');
      break; }
    case 'supplyspire': {
      F(0.14,0.72,0.72,0.07,'#5a451a'); // cluster base
      P([[0.3,0.74],[0.36,0.3],[0.42,0.74]],'#caa14e');
      P([[0.36,0.3],[0.42,0.74],[0.36,0.74]],'#ffe9b0');
      P([[0.55,0.74],[0.62,0.16],[0.69,0.74]],'#e8c86a'); // main crystal
      P([[0.62,0.16],[0.69,0.74],[0.62,0.74]],'#ffe9b0');
      P([[0.55,0.74],[0.62,0.16],[0.55,0.4]],'#8a6a2a');
      P([[0.75,0.74],[0.8,0.45],[0.85,0.74]],'#8a6a2a');
      P([[0.17,0.74],[0.21,0.5],[0.25,0.74]],'#8a6a2a');
      C(0.62,0.48,0.05,'#54e8ff'); // cyan glint
      beacon(0.62,0.18,'rgba(84,232,255,A)',4);
      break; }
  }
  // Concord-specific hard-surface decals bring the human industrial set up to the crystal faction's finish.
  if(!b.def.race){
    const pulse=0.55+0.45*Math.sin(t*4.2+b.id*0.7), teamLight=hexA(col,0.72);
    switch(b.type){
      case 'command':
        ctx.save(); ctx.globalAlpha=0.42+0.3*pulse; ctx.strokeStyle=teamLight; ctx.lineWidth=Math.max(1,w*0.012);
        ctx.beginPath(); ctx.ellipse(x+w*0.32,y+w*0.24,w*0.13,w*0.055,Math.sin(t*1.4)*0.18,0,TAU); ctx.stroke();
        ctx.strokeStyle='rgba(165,229,245,0.55)'; ctx.beginPath(); ctx.moveTo(x+w*0.37,y+w*0.24); ctx.lineTo(x+w*0.56,y+w*0.24); ctx.stroke(); ctx.restore(); break;
      case 'depot':
        F(0.16,0.29,0.24,0.035,'#e4bd66'); F(0.59,0.29,0.24,0.035,'#e4bd66');
        seam(0.18,0.34,0.37,0.34); seam(0.61,0.34,0.82,0.34); break;
      case 'barracks':
        // Lit identification shield above the double door.
        P([[0.45,0.39],[0.55,0.39],[0.55,0.49],[0.5,0.53],[0.45,0.49]],'#162637','rgba(7,14,22,0.9)',1.2);
        F(0.485,0.405,0.03,0.085,teamLight); F(0.46,0.432,0.08,0.03,teamLight); break;
      case 'bunker':
        for(const px of [0.24,0.44,0.64]){
          ctx.save(); ctx.globalAlpha=0.38+0.42*pulse; ctx.fillStyle=teamLight; ctx.shadowColor=col; ctx.shadowBlur=w*0.035;
          ctx.fillRect(x+(px+0.025)*w,y+0.48*w,0.055*w,0.018*w); ctx.restore();
        }
        break;
      case 'factory': case 'heavyfactory':
        for(let i=0;i<4;i++){
          ctx.fillStyle=(i===((t*3|0)%4))?'#ffce77':'rgba(255,170,74,0.36)';
          ctx.fillRect(x+(0.13+i*0.075)*w,y+0.52*w,0.035*w,0.025*w);
        }
        seam(0.1,0.91,0.65,0.91); break;
      case 'starport':
        ctx.save(); ctx.globalAlpha=0.58+0.25*pulse; ctx.strokeStyle=teamLight; ctx.lineWidth=Math.max(1,w*0.014);
        ctx.beginPath(); ctx.arc(x+0.46*w,y+0.56*w,w*0.19,Math.PI*0.1,Math.PI*0.84); ctx.stroke(); ctx.restore();
        break;
      case 'missilesilo':
        for(let i=0;i<5;i++) F(0.36+i*0.06,0.16,0.025,0.04,i%2?'#f2cb68':'#22232a');
        break;
      case 'turret': case 'missile':
        ctx.save(); ctx.globalAlpha=0.48+0.4*pulse; ctx.fillStyle=teamLight; ctx.shadowColor=col; ctx.shadowBlur=w*0.04;
        ctx.beginPath(); ctx.arc(x+0.5*w,y+0.5*w,w*0.055,0,TAU); ctx.fill(); ctx.restore();
        break;
      case 'wall':
        for(let i=0;i<4;i++){
          const px=0.17+i*0.18;
          seam(px,0.25,px+0.11,0.25); seam(px,0.75,px+0.11,0.75);
        }
        break;
      case 'techlab':
        ctx.save(); ctx.globalAlpha=0.48+0.34*pulse; ctx.fillStyle=teamLight;
        for(let i=0;i<5;i++) ctx.fillRect(x+(0.16+i*0.075)*w,y+0.52*w,(0.035+0.02*Math.sin(t*3+i))*w,0.018*w);
        ctx.restore(); break;
    }
  }
  // Shared PBR-like finish pass: top-left key light and lower-right occlusion over every bespoke silhouette.
  ctx.save(); ctx.globalCompositeOperation='source-atop';
  const metal=ctx.createLinearGradient(x,y,x+w,y+w);
  metal.addColorStop(0,'rgba(225,248,255,0.18)');
  metal.addColorStop(0.38,'rgba(105,180,196,0.025)');
  metal.addColorStop(1,'rgba(2,7,15,0.32)');
  ctx.fillStyle=metal; ctx.fillRect(x,y,w,w);
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(224,244,250,0.24)'; ctx.lineWidth=Math.max(0.8,w*0.009);
  ctx.beginPath(); ctx.moveTo(x+w*0.08,y+w*0.1); ctx.lineTo(x+w*0.9,y+w*0.1); ctx.stroke();
  ctx.restore();
  // Strong faction-lit rim ties every building silhouette into the game's team language.
  ctx.save(); ctx.strokeStyle=hexA(col,0.62); ctx.lineWidth=Math.max(1.2,w*0.012);
  ctx.strokeRect(x+1.5,y+1.5,w-3,w-3);
  for(const [px,py] of [[0.055,0.055],[0.945,0.055],[0.055,0.945],[0.945,0.945]]){
    ctx.fillStyle=hexA(col,0.65); ctx.beginPath(); ctx.arc(x+px*w,y+py*w,Math.max(1.2,w*0.012),0,TAU); ctx.fill();
  }
  ctx.restore();
  damageFX(b,x,y,w); // smoke & fire when hurt — buildings feel alive
}


function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,VW,VH);
  // Camera transform (+ screen shake).
  let shx=0,shy=0;
  if(shakeT>0){ shx=rand(-1,1)*shakeMag*shakeT*3; shy=rand(-1,1)*shakeMag*shakeT*3; }
  ctx.save();
  ctx.translate(VW/2+shx*cam.zoom, VH/2+shy*cam.zoom);
  ctx.scale(cam.zoom,cam.zoom);
  ctx.translate(-cam.x,-cam.y);
  // Visible tile range.
  const x0=Math.max(0,Math.floor((cam.x-VW/cam.zoom/2)/TILE)-1),
        x1=Math.min(MAP_W-1,Math.ceil((cam.x+VW/cam.zoom/2)/TILE)+1),
        y0=Math.max(0,Math.floor((cam.y-VH/cam.zoom/2)/TILE)-1),
        y1=Math.min(MAP_H-1,Math.ceil((cam.y+VH/cam.zoom/2)/TILE)+1);
  // Terrain (pre-baked detail tiles — one drawImage per tile).
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const i=tIdx(tx,ty), t=mapTiles[i];
    const v=(tx*37+ty*73+tx*ty*13+(tx>>>2)*19+(ty>>>1)*7)&7;
    // Mountains + water render as unified mass sprites below; ground shows at the seams.
    const dt=(t===1||t===4)?terrainDetail[0][shade[i]%4][v]:tileArtFor(t,i,v);
    ctx.drawImage(dt,tx*TILE,ty*TILE);
    // Bud 2026-10-14: elevation — raised plateau tiles get a sunlit top and
    // cliff shadows on edges where the neighbor drops down (visual only).
    if(elev[i]===1){
      const px=tx*TILE, py=ty*TILE;
      ctx.fillStyle='rgba(255,250,235,0.10)'; ctx.fillRect(px,py,TILE,TILE);
      const eN=ty>0?elev[tIdx(tx,ty-1)]:0, eS=ty<MAP_H-1?elev[tIdx(tx,ty+1)]:0;
      const eW=tx>0?elev[tIdx(tx-1,ty)]:0, eE=tx<MAP_W-1?elev[tIdx(tx+1,ty)]:0;
      if(!eS){ const g=ctx.createLinearGradient(0,py+TILE-10,0,py+TILE);
        g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(10,8,6,0.55)');
        ctx.fillStyle=g; ctx.fillRect(px,py+TILE-10,TILE,10); }
      if(!eE){ const g=ctx.createLinearGradient(px+TILE-7,0,px+TILE,0);
        g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(10,8,6,0.35)');
        ctx.fillStyle=g; ctx.fillRect(px+TILE-7,py,7,TILE); }
      if(!eN){ ctx.fillStyle='rgba(255,250,235,0.14)'; ctx.fillRect(px,py,TILE,3); }
      if(!eW){ ctx.fillStyle='rgba(255,250,235,0.08)'; ctx.fillRect(px,py,3,TILE); }
    }
  }
  // Big terrain masses (Bud 2026-10-11): one sprite per range / water body.
  const vx0=x0*TILE, vx1=(x1+1)*TILE, vy0=y0*TILE, vy1=(y1+1)*TILE;
  for(const m of mountainMasses){
    if(m.x+m.w<vx0||m.x>vx1||m.y+m.h<vy0||m.y>vy1) continue;
    ctx.drawImage(m.cv,m.x,m.y);
  }
  const wf=(G.time*1.5|0)&1;
  for(const m of waterMasses){
    if(m.x+m.w<vx0||m.x>vx1||m.y+m.h<vy0||m.y>vy1) continue;
    ctx.drawImage(m.frames[wf],m.x,m.y);
  }
  // Hand-placed-style procedural set dressing, baked from map coordinates; it never affects pathing.
  renderTerrainProps(vx0,vy0,vx1,vy1);
  // One fixed orbital key light unifies the terrain and gives the world cinematic depth.
  ctx.save();
  const art=currentTerrainArt(), lx=MAP_PX*0.22, ly=MAP_PX*0.18;
  const light=ctx.createRadialGradient(lx,ly,20,lx,ly,MAP_PX*0.72);
  light.addColorStop(0,art.ambient);
  light.addColorStop(0.42,art.warmLight);
  light.addColorStop(1,'rgba(0,5,15,0.16)');
  ctx.fillStyle=light; ctx.fillRect(vx0,vy0,vx1-vx0,vy1-vy0);
  ctx.restore();
  // Art-port: scorch marks left by explosions (fade out over ~20 s).
  if(G.decals&&G.decals.length){
    for(let k=G.decals.length-1;k>=0;k--){ const d=G.decals[k], age=G.time-d.born;
      if(age>=d.life){ G.decals.splice(k,1); continue; }
      ctx.globalAlpha=0.55*(1-age/d.life); ctx.drawImage(ART.scorch,d.x-d.r,d.y-d.r,d.r*2,d.r*2); }
    ctx.globalAlpha=1;
  }
  // Resources (visible if explored).
  for(const r of G.resources){
    if(r.amount<=0||!tileExplored(r.tx,r.ty)) continue;
    const dim=!tileVisible(r.tx,r.ty);
    ctx.save(); if(dim) ctx.globalAlpha=0.55;
    if(r.type==='ore'){
      const rich=0.58+0.42*r.amount/r.max;
      ctx.fillStyle='rgba(1,8,13,0.55)';
      ctx.beginPath(); ctx.ellipse(r.x,r.y+6,13,6,0,0,TAU); ctx.fill();
      ctx.save(); ctx.shadowColor='rgba(74,203,255,0.75)'; ctx.shadowBlur=7;
      for(const [ox,oy,sz] of [[-7,-3,8],[5,-6,10],[1,6,7]]){
        const h=sz*(0.75+0.25*rich), xx=r.x+ox, yy=r.y+oy;
        ctx.fillStyle='#54b7df'; ctx.beginPath();
        ctx.moveTo(xx-h*0.42,yy+h*0.34); ctx.lineTo(xx-h*0.25,yy-h*0.26);
        ctx.lineTo(xx,yy-h*0.58); ctx.lineTo(xx+h*0.38,yy-h*0.08);
        ctx.lineTo(xx+h*0.3,yy+h*0.36); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(210,248,255,0.82)'; ctx.beginPath();
        ctx.moveTo(xx-h*0.25,yy-h*0.26); ctx.lineTo(xx,yy-h*0.58);
        ctx.lineTo(xx+h*0.06,yy+h*0.12); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(16,91,128,0.7)'; ctx.beginPath();
        ctx.moveTo(xx+h*0.06,yy+h*0.12); ctx.lineTo(xx+h*0.38,yy-h*0.08);
        ctx.lineTo(xx+h*0.3,yy+h*0.36); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    } else {
      const pu=1+0.12*Math.sin(G.time*3.4+r.tx);
      ctx.fillStyle='rgba(0,0,0,0.48)';
      ctx.beginPath(); ctx.ellipse(r.x,r.y+7,13,7,0,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(190,127,255,0.52)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.ellipse(r.x,r.y+2,12*pu,8*pu,0,0,TAU); ctx.stroke();
      ctx.fillStyle='#291944';
      ctx.beginPath(); ctx.ellipse(r.x,r.y,10*pu,7*pu,0,0,TAU); ctx.fill();
      ctx.save(); ctx.shadowColor='rgba(183,105,255,0.8)'; ctx.shadowBlur=8;
      const pulse=0.75+0.25*Math.sin(G.time*5+r.tx);
      ctx.fillStyle='rgba(168,111,240,'+pulse.toFixed(2)+')';
      ctx.beginPath(); ctx.ellipse(r.x,r.y-1,7*pu,4.5*pu,0,0,TAU); ctx.fill();
      ctx.fillStyle='#f0dcff';
      ctx.beginPath(); ctx.ellipse(r.x-1,r.y-3,3.5*pu,2*pu,0,0,TAU); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  // Move/attack markers.
  for(const m of G.markers){
    const k=m.t/0.7;
    ctx.strokeStyle=m.attack?`rgba(255,80,60,${k})`:`rgba(80,255,120,${k})`;
    ctx.lineWidth=2; const s=10*(1.4-k*0.4);
    ctx.beginPath();
    ctx.moveTo(m.x-s,m.y-s); ctx.lineTo(m.x+s,m.y+s);
    ctx.moveTo(m.x+s,m.y-s); ctx.lineTo(m.x-s,m.y+s);
    ctx.stroke();
  }
  // Buildings.
  for(const b of G.buildings){
    if(b.dead) continue;
    const own=b.owner===PID, vis=tileVisible(px2t(b.cx),px2t(b.cy));
    if(!own&&!vis){
      // Ghost of last-seen enemy building on explored ground.
      if(tileExplored(px2t(b.cx),px2t(b.cy))){
        ctx.save(); ctx.globalAlpha=0.35;
        ctx.strokeStyle='#ff5a4d'; ctx.lineWidth=2;
        const w=b.def.size*TILE;
        ctx.strokeRect(b.lastSeenX-w/2,b.lastSeenY-w/2,w,w);
        ctx.restore();
      }
      continue;
    }
    if(own&&vis){ b.lastSeenX=b.cx; b.lastSeenY=b.cy; }
    const p=G.players[b.owner], w=b.def.size*TILE, x=b.cx-w/2, y=b.cy-w/2;
    const constructing=b.progress<1, fx=bldFx(b.def.size);
    // Art-port: soft drop shadow beneath every finished building.
    if(!constructing) ctx.drawImage(fx.shadow,x-fx.pad,y-fx.pad,w+fx.pad*2,w+fx.pad*2);
    ctx.save(); if(constructing) ctx.globalAlpha=0.75;
    drawBuildingShape(b,x,y,w);
    // Art-port: top-left light gloss + panel seams over every finished building.
    if(!constructing) ctx.drawImage(fx.gloss,x,y,w,w);
    if(constructing){ ctx.strokeStyle='#ffd76a'; ctx.lineWidth=2; ctx.strokeRect(x,y,w,w); }
    ctx.restore();
    if(G.sel.includes(b)){
      ctx.strokeStyle='#3dff5e'; ctx.lineWidth=2;
      ctx.strokeRect(x-4,y-4,w+8,w+8);
      if(b.rally){ ctx.strokeStyle='rgba(61,255,94,0.7)'; ctx.setLineDash([6,4]);
        ctx.beginPath(); ctx.moveTo(b.cx,b.cy); ctx.lineTo(b.rally.x,b.rally.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='#3dff5e'; ctx.fillRect(b.rally.x-3,b.rally.y-3,6,6); }
    }
    if(constructing){
      drawHealthBar(b.cx,y-12,w,b.progress);
    } else if(b.hp<b.maxhp||G.sel.includes(b)){
      drawHealthBar(b.cx,y-10,w,b.hp/b.maxhp);
    }
    if(b.maxShield>0&&(b.shield<b.maxShield||G.sel.includes(b))) drawShieldBar(b.cx,y-16,w,b.shield/b.maxShield);
    if(b.warping){ // Ascendant warp-in shimmer
      const a=0.35+0.25*Math.sin(G.time*8);
      ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#7fe8ff';
      ctx.fillRect(x,y,w,w); ctx.restore();
    }
    if(b.queue.length&&own){
      ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(x,y+w-14,Math.min(w,b.queue.length*12),12);
      ctx.fillStyle='#9fd8ff';
      for(let i=0;i<b.queue.length;i++) ctx.fillRect(x+2+i*12,y+w-12,8,8);
      if(b.qprog>0){ ctx.fillStyle='#3dff5e'; ctx.fillRect(x,y+w-4,w*b.qprog,3); }
    }
  }
  // Units.
  for(const u of G.units){
    if(u.dead){ // fading wreck
      if(u.deathT>0){ ctx.save(); ctx.globalAlpha=u.deathT/0.6*0.6;
        ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(u.x,u.y,u.def.size*0.5,0,TAU); ctx.fill();
        ctx.restore(); }
      continue;
    }
    if(u.loadedBy) continue;
    const own=u.owner===PID;
    if(!own&&!visibleToViewer(u)) continue;
    if(G.sel.includes(u)){
      ctx.strokeStyle='#3dff5e'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(u.x,u.y,u.def.size+6,(u.def.size+6)*0.7,0,0,TAU); ctx.stroke();
    }
    drawUnitShape(u);
    // Hit flash: brief white blink when recently damaged.
    if(G.time-u.lastDmgT<0.15){
      ctx.save(); ctx.globalAlpha=0.65*(1-(G.time-u.lastDmgT)/0.15);
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(u.x,u.y-(u.def.air?22:0),u.def.size*0.9,0,TAU); ctx.fill();
      ctx.restore();
    }
    if(u.hp<u.maxhp||G.sel.includes(u)) drawHealthBar(u.x,u.y-(u.def.air?34:20),26,u.hp/u.maxhp);
    if(u.maxShield>0&&(u.shield<u.maxShield||G.sel.includes(u))) drawShieldBar(u.x,u.y-(u.def.air?40:26),26,u.shield/u.maxShield);
    if(u.phaseT>0){ ctx.save(); ctx.globalAlpha=0.45+0.25*Math.sin(G.time*14); ctx.strokeStyle='#9a7fff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(u.x,u.y,u.def.size+6,0,TAU); ctx.stroke(); ctx.restore(); } // phased shimmer
    if(u.slowT>0){ ctx.save(); ctx.strokeStyle='rgba(200,240,255,0.8)'; ctx.lineWidth=1.5;
      ctx.strokeRect(u.x-u.def.size-3,u.y-u.def.size-3,(u.def.size+3)*2,(u.def.size+3)*2); ctx.restore(); } // snared
    drawIdleWorkerIndicator(u);
  }
  // Projectiles.
  for(const p of G.projectiles){
    let dy=0;
    if(p.arc){ dy=-Math.sin(Math.min(1,p.t)*Math.PI)*46; }
    ctx.strokeStyle=p.color; ctx.lineWidth=p.size;
    ctx.beginPath(); ctx.moveTo(p.x,p.y+dy); ctx.lineTo(p.x-6,p.y+dy+2); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.fillRect(p.x-1.5,p.y+dy-1.5,3,3);
  }
  // Particles.
  for(const pt of G.particles){
    const k=pt.life/pt.maxlife;
    if(pt.ring){
      ctx.strokeStyle=hexA(pt.color||'#ffcc88',k); ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size+(1-k)*pt.grow,0,TAU); ctx.stroke();
    } else if(pt.flash){
      // Art-port: fireball flash — bright shrinking disc.
      ctx.globalAlpha=k; ctx.fillStyle=pt.color||'#ffb04a';
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size*(0.6+0.4*k),0,TAU); ctx.fill();
      ctx.globalAlpha=1;
    } else {
      ctx.fillStyle=hexA(pt.color.startsWith('#')?pt.color:'#ffaa33',k);
      ctx.globalAlpha=k;
      ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);
      ctx.globalAlpha=1;
    }
  }
  // Placement ghost.
  if(G.placing){
    const def=BDEF[G.placing.btype], m=s2w({clientX:mouse.x,clientY:mouse.y});
    // Bud's wall lines: live line preview while dragging.
    if(G.placing.btype==='wall'&&G.wallLine&&G.wallLine.dragging){
      drawWallLinePreview(screenToWorld(G.wallLine.sx,G.wallLine.sy),
        s2w({clientX:G.wallLine.cx,clientY:G.wallLine.cy}));
    } else {
      const btx=Math.floor(m.x/TILE-def.size/2), bty=Math.floor(m.y/TILE-def.size/2);
      const requirementMet=!def.req||playerHasBuilding(PID,def.req);
      const ok=requirementMet&&placementValid(G.placing.btype,btx,bty);
      ctx.fillStyle=ok?'rgba(80,255,120,0.35)':'rgba(255,60,60,0.35)';
      ctx.fillRect(btx*TILE,bty*TILE,def.size*TILE,def.size*TILE);
      ctx.strokeStyle=ok?'#3dff5e':'#ff4d4d'; ctx.lineWidth=2;
      ctx.strokeRect(btx*TILE,bty*TILE,def.size*TILE,def.size*TILE);
      // Bud's batch-build: show remaining count on the ghost.
      if(G.placing.batch>1){
        const left=G.placing.batch-(G.placing.placed||0);
        ctx.fillStyle='#fff'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
        ctx.fillText('x'+left+' left', btx*TILE+def.size*TILE/2, bty*TILE-8);
        ctx.textAlign='left';
      }
      // Bud's wall lines: hint while placing walls.
      if(G.placing.btype==='wall'){
        ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
        ctx.fillText('Drag = wall line  •  Tap = 1 wall', btx*TILE+TILE/2, bty*TILE-10);
        ctx.textAlign='left';
      }
    }
  }
  // Attack-move armed cursor hint.
  if(G.attackMoveArmed){
    const m=s2w({clientX:mouse.x,clientY:mouse.y});
    ctx.strokeStyle='#ff5a4d'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(m.x,m.y,12,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m.x-16,m.y); ctx.lineTo(m.x+16,m.y);
    ctx.moveTo(m.x,m.y-16); ctx.lineTo(m.x,m.y+16); ctx.stroke();
  }
  // Rally armed cursor hint (green flag marker).
  if(G.rallyArmed){
    const m=s2w({clientX:mouse.x,clientY:mouse.y});
    ctx.strokeStyle='#3dff5e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(m.x,m.y-14); ctx.lineTo(m.x,m.y+10); ctx.stroke();
    ctx.fillStyle='rgba(61,255,94,0.85)';
    ctx.beginPath(); ctx.moveTo(m.x,m.y-14); ctx.lineTo(m.x+14,m.y-9); ctx.lineTo(m.x,m.y-4); ctx.closePath(); ctx.fill();
  }
  // Fog overlay for human viewer.
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(fogCanvas,0,0,MAP_PX,MAP_PX);
  ctx.restore();

  // Strategic missiles render above fog so their flight and target remain readable.
  for(const n of G.nukes){
    const k=clamp(n.t/n.duration,0,1), pos=worldToScreen(n.x,n.y);
    const h=Math.sin(k*Math.PI)*Math.min(180,VH*0.22);
    const tp=worldToScreen(n.tx,n.ty);
    ctx.save();
    ctx.strokeStyle='rgba(255,70,45,0.78)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(tp.x,tp.y,18+8*Math.sin(G.time*7),0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tp.x-28,tp.y); ctx.lineTo(tp.x+28,tp.y);
    ctx.moveTo(tp.x,tp.y-28); ctx.lineTo(tp.x,tp.y+28); ctx.stroke();
    ctx.translate(pos.x,pos.y-h); ctx.rotate(Math.atan2(n.ty-n.sy,n.tx-n.sx));
    ctx.fillStyle='#dfe6ee'; ctx.fillRect(-15,-4,30,8);
    ctx.fillStyle='#ffb13b'; ctx.beginPath(); ctx.moveTo(-15,0); ctx.lineTo(-26,-7); ctx.lineTo(-26,7); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff5a3c'; ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(8,-7); ctx.lineTo(8,7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if(G.nukeArmed){
    const m={x:mouse.x||VW/2,y:mouse.y||VH/2};
    ctx.strokeStyle='#ff3b30'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(m.x,m.y,24+5*Math.sin(G.time*6),0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m.x-34,m.y); ctx.lineTo(m.x+34,m.y);
    ctx.moveTo(m.x,m.y-34); ctx.lineTo(m.x,m.y+34); ctx.stroke();
  }
  if(G.nukeFlash>0){
    ctx.fillStyle='rgba(255,246,205,'+Math.min(0.8,G.nukeFlash*0.8)+')';
    ctx.fillRect(0,0,VW,VH);
  }
  renderHUD();
  renderMinimap();
}

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function renderHUD(){

    const supCol2 = p.supplyUsed>=p.supplyCap ? '#ff5a4d' : '#e8f2ff';

    const supCol = p.supplyUsed>=p.supplyCap ? '#ff5a4d' : '#e8f2ff';

    ctx.textAlign='right'; ctx.fillStyle='#9fb6cc';
    const mm=String(Math.floor(G.time/60)).padStart(2,'0'), ss=String(Math.floor(G.time%60)).padStart(2,'0');
    ctx.fillText(mm+':'+ss+'   x'+G.speed+'   '+FPS+'fps   [F1] help', VW-60, 18);
  }
  // Fullscreen button (Bud: tap to go fullscreen, harder to swipe away).
  { const fb=fsBtnRect();
    ctx.fillStyle='rgba(16,28,42,0.88)'; rr(fb.x,fb.y,fb.w,fb.h,6); ctx.fill();
    ctx.strokeStyle='#3a5a78'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#9fd4ff'; ctx.font='bold 16px "Segoe UI",Verdana,sans-serif'; ctx.textAlign='center';
    ctx.fillText('⛶', fb.x+fb.w/2, fb.y+fb.h/2+1); ctx.textAlign='left'; }
  // Objective.
  ctx.textAlign='center'; ctx.fillStyle='rgba(230,240,255,0.75)'; ctx.font='13px "Segoe UI",Verdana,sans-serif';
  ctx.fillText((G.mode==='survival'||G.mode==='war')?'':(G.objectiveText||''), VW/2, 52);
  // Touch camera controls: PAN toggle (one-thumb pan) — only on touch devices.
  if(touchUsed && G.running && !G.over){
    const pb=panBtnRect(), on=G.panMode;
    ctx.fillStyle=on?'rgba(61,255,94,0.28)':'rgba(16,28,42,0.88)';
    rr(pb.x,pb.y,pb.w,pb.h,8); ctx.fill();
    ctx.strokeStyle=on?'#3dff5e':'#3a5a78'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=on?'#3dff5e':'#9fb6cc'; ctx.font='bold 13px "Segoe UI",Verdana,sans-serif';
    ctx.textAlign='center'; ctx.fillText('✋ PAN', pb.x+pb.w/2, pb.y+pb.h/2+1);
    ctx.fillStyle=on?'#3dff5e':'#66798e'; ctx.font='10px "Segoe UI",Verdana,sans-serif';
    ctx.fillText(on?'drag to move':'tap, then drag', pb.x+pb.w/2, pb.y+pb.h-10);
    ctx.textAlign='left';
  }
  if(G.mode==='campaign') renderMissionHUD();
  if(G.mode==='survival') renderSurvivalHUD();
  if(G.mode==='war') renderWarHUD();
  renderAllyCmd(); // Bud's ally command buttons (war 2v2)
  // Pause + speed HUD buttons (mouse and touch).
  if(G.running&&!G.over){
    const hbtns=[[pauseBtnRect(),G.paused?'▶ RESUME':'⏸ PAUSE',G.paused],[speedBtnRect(),'⏩ x'+G.speed,G.speed>1]];
    for(const hb of hbtns){ const r=hb[0], label=hb[1], act=hb[2];
      ctx.fillStyle=act?'rgba(255,215,106,0.22)':'rgba(16,28,42,0.88)';
      rr(r.x,r.y,r.w,r.h,8); ctx.fill();
      ctx.strokeStyle=act?'#ffd76a':'#3a5a78'; ctx.lineWidth=2; ctx.stroke();

      ctx.textAlign='center'; ctx.fillText(label,r.x+r.w/2,r.y+r.h/2+1);
    }
    ctx.textAlign='left';
  }
  if(G.paused) renderPauseMenu();
  renderSelectionPanel();
  renderCommandCard();
  // Drag-select box: visible rectangle while box-selecting with the mouse.
  if(mouse.down&&mouse.dragging&&G.running&&!G.over){
    const bx0=Math.min(mouse.dragSX,mouse.x), by0=Math.min(mouse.dragSY,mouse.y),
          bw=Math.abs(mouse.x-mouse.dragSX), bh=Math.abs(mouse.y-mouse.dragSY);
    ctx.fillStyle='rgba(61,255,94,0.12)'; ctx.fillRect(bx0,by0,bw,bh);
    ctx.strokeStyle='#3dff5e'; ctx.lineWidth=1.5; ctx.strokeRect(bx0,by0,bw,bh);
  }
  // Hint text — wrapped to screen width and lifted above the selection panel /
  // command row so long hints never run off a phone screen (Claude QA-10 port).
  if(hintT>0&&hintText){
    ctx.textAlign='center'; ctx.font='14px "Segoe UI",Verdana,sans-serif';
    const maxW=VW-24, words=String(hintText).split(' '), lines=[]; let cur='';
    for(const wd of words){ const t=cur?cur+' '+wd:wd; if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=wd; } else cur=t; }
    if(cur) lines.push(cur);
    let hy=VH-130;
    if(G.sel.length) hy=Math.min(hy,VH-168);
    if(G.cmdTopY!=null) hy=Math.min(hy,G.cmdTopY-14);
    hy-=(lines.length-1)*18;
    const al=clamp(hintT,0,1);
    lines.forEach((ln,i)=>{ ctx.fillStyle='rgba(0,0,0,'+(0.55*al)+')'; ctx.fillText(ln,VW/2+1,hy+i*18+1);
      ctx.fillStyle=`rgba(255,240,180,${al})`; ctx.fillText(ln,VW/2,hy+i*18); });
  }
  if(showHelp) renderHelp();
  if(G.over) renderGameOver();
}

function fmtCost(cost){
  const parts=[];
  if(cost.ore) parts.push('◆'+cost.ore);
  if(cost.flux) parts.push('⬢'+cost.flux);
  return parts.join(' ');
}
function renderCommandCard(){
  const cmds=getCommands();
  G.cmdRects=[];
  G.cmdMenuBtn=null;
  if(!cmds.length){ G.cmdMenuOpen=false;
    if(mmCanvas) mmCanvas.style.visibility='visible'; return; }
  const small=VW<600, n=cmds.length;
  const placementCancel=small&&n===1&&cmds[0].id==='cancel';
  const bw=placementCancel?176:(small?68:76), bh=placementCancel?60:(small?52:60), gap=8;
  const totalW=n*(bw+gap)-gap;
  // Small screens: when the button row would overflow the viewport, collapse
  // into a single ORDERS button that opens a full tappable menu (Bud 2026-10-10:
  // the wide bar had off-screen buttons with no way to scroll to them).
  const y0=small ? VH-bh-14-MM_S-16 : VH-bh-14;
  G.cmdTopY=y0; // hint text lifts above the command row (Claude QA-10 port)
  if(totalW > VW-24){
    const mw=190, mh=56, mx=VW/2-mw/2, my=y0;
    const hov=mouse.x>=mx&&mouse.x<=mx+mw&&mouse.y>=my&&mouse.y<=my+mh;
    ctx.fillStyle=hov?'rgba(50,90,130,0.95)':'rgba(16,28,42,0.92)';
    rr(mx,my,mw,mh,8); ctx.fill();
    ctx.strokeStyle=G.cmdMenuOpen?'#7fd4ff':'#3a5a78'; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 15px "Segoe UI",Verdana,sans-serif'; ctx.textAlign='center';
    ctx.fillText('\u2630 ORDERS ('+n+')', VW/2, my+35);
    ctx.textAlign='left';
    G.cmdMenuBtn={x:mx,y:my,w:mw,h:mh};
    // The minimap is a separate canvas above the main one: hide it while the
    // menu is open so it can't cover or steal taps from the bottom rows.
    if(mmCanvas) mmCanvas.style.visibility=G.cmdMenuOpen?'hidden':'visible';
    if(G.cmdMenuOpen) renderCommandMenu(cmds);
    return;
  }
  G.cmdMenuOpen=false;
  if(mmCanvas) mmCanvas.style.visibility='visible';
  const x0=VW/2-totalW/2;
  // On small screens the minimap + selection panel own the bottom strip:
  // float the command buttons above them so they stay tappable.
  let hoverTip=null;
  for(let i=0;i<n;i++){
    const c=cmds[i], x=x0+i*(bw+gap), isCancel=c.id==='cancel';
    const hov=mouse.x>=x&&mouse.x<=x+bw&&mouse.y>=y0&&mouse.y<=y0+bh;
    ctx.fillStyle=isCancel?(hov?'rgba(142,48,52,0.98)':'rgba(112,38,42,0.98)')
                          :(hov?'rgba(50,90,130,0.95)':'rgba(16,28,42,0.92)');
    rr(x,y0,bw,bh,6); ctx.fill();
    ctx.strokeStyle=isCancel?'#ff7777':(hov?'#7fd4ff':'#3a5a78'); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='11px "Segoe UI",Verdana,sans-serif'; ctx.textAlign='center';
    const lines=c.label.split('\n');
    lines.forEach((ln,li)=>ctx.fillText(ln, x+bw/2, y0+20+li*13));
    // Cost line: derive from the command id (t_<unit>, b_<building>, r_<upgrade>).
    let costStr='';
    if(c.id.startsWith('t_')){ const d=UDEF[c.id.slice(2)]; if(d&&d.cost) costStr=fmtCost(d.cost); }
    else if(c.id.startsWith('b_')){ const d=BDEF[c.id.slice(2)]; if(d&&d.cost) costStr=fmtCost(d.cost); }
    else if(c.id.startsWith('upg_')){ const u=UPG[c.id.slice(4)]; if(u&&u.cost) costStr=fmtCost(u.cost); }
    if(costStr){ ctx.fillStyle='#8fd0ff'; ctx.font='10px "Segoe UI",Verdana,sans-serif';
      ctx.fillText(costStr, x+bw/2, y0+bh-22); }
    if(c.hotkey){ ctx.fillStyle='#ffd76a'; ctx.font='bold 11px "Segoe UI",Verdana,sans-serif';
      ctx.fillText('['+c.hotkey+']', x+bw/2, y0+bh-10); }
    G.cmdRects.push({x,y:y0,w:bw,h:bh,cmd:c});
    if(hov&&c.tip) hoverTip=c.tip;
  }
  if(hoverTip){ ctx.font='13px "Segoe UI",Verdana,sans-serif';
    const tw=ctx.measureText(hoverTip).width+20;
    ctx.fillStyle='rgba(8,14,22,0.95)'; rr(VW/2-tw/2,y0-34,tw,24,6); ctx.fill();
    ctx.strokeStyle='#3a5a78'; ctx.stroke();
    ctx.fillStyle='#ffe9a8'; ctx.textAlign='center'; ctx.fillText(hoverTip,VW/2,y0-22); }
  ctx.textAlign='left';
}
// Bottom-sheet orders menu for small screens: every command as a big tappable row.
function renderCommandMenu(cmds){

  ctx.strokeStyle='#3a5a78'; ctx.stroke();

  const title=G.sel.length&&G.sel.every(e=>e.kind==='unit'&&e.def.worker)?'Pioneer Orders':'Orders';
  ctx.fillText(title,VW/2,sy+30);
  ctx.fillStyle='#9fb6cc'; ctx.font='12px "Segoe UI",Verdana,sans-serif';
  ctx.fillText(placementCancel?'tap Cancel, or tap outside to exit':'tap an order, or tap outside to close',VW/2,sy+46);
  ctx.textAlign='left';
  G.cmdMenuRects=[];

/* ------------------------------ 18. AI opponent ------------------------------
   Concord-vs-Concord skirmish AI: honest economy (same rules as the player),
   build-order driven, defends its base, attacks in escalating waves.          */
let AI = {};
const AI_OPENING_HOLD_SECONDS=1800; // 30 in-game minutes before planned enemy assaults.
const AI_THINK_INTERVAL_TICKS=30, AI_THINK_INTERVAL_SECONDS=0.5; // one macro/tactical decision every half game-second.
function aiInitState(pid){
