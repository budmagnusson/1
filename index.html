    dmgTaken:0, personality:'balanced', phase:allied?'ASSAULT':'HOLD',
    holdSeconds:holdSeconds,
    lastDefenseT:-1e9, lastAttacker:null, threatDamage:0, threatDamageT:-1e9,
    counterattackT:-1e9, counterWatch:null };
}
// Difficulty modifiers (Bud picks on the war menu).
const WAR_DIFF={
  easy:  { aggroCap:2, waveMul:0.7, prodMul:1.25, label:'EASY' },
  normal:{ aggroCap:4, waveMul:0.9, prodMul:1.1,  label:'NORMAL' },
  hard:  { aggroCap:7, waveMul:1.35,prodMul:0.85, label:'HARD' },
};
// AI personalities (Tina: enemies shouldn't all behave identically).
const AI_PERSONALITY={
  balanced: { waveT:210, wantWorkers:6, defenders:6,  waveBonus:0  },
  aggressor:{ waveT:150, wantWorkers:6, defenders:3,  waveBonus:6  },
  turtler:  { waveT:300, wantWorkers:6, defenders:10, waveBonus:-2 },
  expander: { waveT:240, wantWorkers:8, defenders:5,  waveBonus:0  },
};
function aiPlacementValid(btype,btx,bty,pid){
  const def=BDEF[btype], f=fog[pid];
  for(let y=0;y<def.size;y++) for(let x=0;x<def.size;x++){
    const tx=btx+x, ty=bty+y;
    if(!inMap(tx,ty)) return false;
    if(mapTiles[tIdx(tx,ty)]!==0||blocked[tIdx(tx,ty)]) return false;
    if(f[tIdx(tx,ty)]<1) return false; // AI only builds on explored ground
  }
  return true;
}
// Bud 2026-10-11 "Build With Me": when ON, the ally anchors ALL new construction
// at the player's base instead of its own start — one big combined base.
// Enemies are never redirected (team check); falls back to own base if the
// player's base position is gone.
function aiBuildAnchor(pid){
  if(G.buildWithMe&&pid!==PID&&(G.team[pid]||0)===0){
    const pb=G.basePos[PID]; if(pb) return pb;
  }
  return G.basePos[pid];
}
function aiBuild(btype,pid){
  const def=BDEF[btype], p=G.players[pid], bp=aiBuildAnchor(pid);
  if(!bp||p.ore<def.cost.ore||p.flux<def.cost.flux) return false;
  for(let r=5;r<22;r++) for(let a=0;a<16;a++){
    const th=a/16*TAU;
    const btx=Math.round(bp.x+Math.cos(th)*r-def.size/2),
          bty=Math.round(bp.y+Math.sin(th)*r-def.size/2);
    if(!aiPlacementValid(btype,btx,bty,pid)) continue;
    // Ascendant Phase 2: warp-in needs no worker.
    if(def.race==='ascendant'&&def.warp){
      p.ore-=def.cost.ore; p.flux-=def.cost.flux;
      const b=spawnBuilding(btype,pid,btx,bty);
      b.warping=true; b.warpT=def.warp; b.hp=1;
      return true;
    }
    const w=nearestAIWorker(btx*TILE,bty*TILE,pid);
    if(!w) return false;
    p.ore-=def.cost.ore; p.flux-=def.cost.flux;
    const b=spawnBuilding(btype,pid,btx,bty);
    w.ord={t:'construct',b}; setPathTo(w,b.cx,b.cy);
    return true;
  }
  return false;
}
function nearestAIWorker(x,y,pid){
  let best=null,bd=Infinity;
  for(const u of G.units){ if(u.dead||u.owner!==pid||!u.def.worker||u.loadedBy) continue;
    if(u.ord.t==='construct'||u.ord.t==='build') continue; // don't yank builders
    const d=dist2(x,y,u.x,u.y); if(d<bd){ bd=d; best=u; } }
  return best;
}
// Mid-map natural expansion sites, laid out fresh by genWarMap every game
// (rotationally symmetric pairs). AI reads this list; never hardcode sites.
const WAR_EXPOS=[];
// Nearest expansion site not already taken by a command center.
function aiExpoSite(pid){
  let best=null,bd=1e18;
  for(const s of WAR_EXPOS){
    // 7-tile radius: the two sites are 8 apart, so one expo must not claim both.
    // Ascendant enemy AI: heartspire claims a site just like a command center.
    const taken=G.buildings.some(b=>!b.dead&&(b.type==='command'||b.type==='heartspire')&&
      dist2(b.cx,b.cy,s.x*TILE,s.y*TILE)<(7*TILE)*(7*TILE));
    if(taken) continue;
    const bp=G.basePos[pid];
    const d=(s.x-bp.x)*(s.x-bp.x)+(s.y-bp.y)*(s.y-bp.y);
    if(d<bd){ bd=d; best=s; }
  }
  return best;
}
// Build a structure centered near a specific tile (for expansions).
function aiBuildAt(btype,pid,tx,ty){
  const def=BDEF[btype], p=G.players[pid];
  if(p.ore<def.cost.ore||p.flux<def.cost.flux) return false;
  const st=AI[pid], bad=(st&&st.bad)||[];
  for(let r=0;r<10;r++) for(let a=0;a<12;a++){
    const th=a/12*TAU;
    const btx=Math.round(tx+Math.cos(th)*r-def.size/2),
          bty=Math.round(ty+Math.sin(th)*r-def.size/2);
    if(bad.some(s=>Math.abs(s.x-btx)<3&&Math.abs(s.y-bty)<3)) continue; // scrapped unreachable site: don't retry it
    if(!aiPlacementValid(btype,btx,bty,pid)) continue;
    // Ascendant Phase 2: warp-in needs no worker.
    if(def.race==='ascendant'&&def.warp){
      p.ore-=def.cost.ore; p.flux-=def.cost.flux;
      const b=spawnBuilding(btype,pid,btx,bty);
      b.warping=true; b.warpT=def.warp; b.hp=1;
      return true;
    }
    const w=nearestAIWorker(btx*TILE,bty*TILE,pid);
    if(!w) return false;
    p.ore-=def.cost.ore; p.flux-=def.cost.flux;
    const b=spawnBuilding(btype,pid,btx,bty);
    w.ord={t:'construct',b}; setPathTo(w,b.cx,b.cy);
    return true;
  }
  return false;
}
// Defensive fortification (Bud 2026-10-11; strengthened same day after his
// "the ai has no chance" playtest verdict): hard/ally AI builds REAL defensive
// bases. Walls ring the main base on the enemy-facing side AND run a line
// across the likeliest attack approach; expansion outposts get their own wall
// lines. Starts minute ~3.5 (before Bud's early pressure), big caps, and fast
// rebuilds when defenses die. Static D buys time for the army — this round
// errs strong on Bud's call; he'll say if it's too much.
function aiFortify(pid){
  const st=AI[pid]; if(!st) return;
  const bp=aiBuildAnchor(pid); if(!bp) return; // Build With Me: walls ring the combined base
  if((st.fortT||0)>G.time) return;
  const nWall=G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='wall').length;
  // Rebuild urgency: if the wall line just got smashed, skip the cooldown.
  if(nWall<(st.lastWall||0)-6) st.fortT=0;
  st.lastWall=nWall;
  if((st.fortT||0)>G.time) return;
  if(nWall>=90) return;
  const foe=nearestEnemyBase(pid); if(!foe) return;
  const bx=bp.x*TILE, by=bp.y*TILE;
  const dx=foe.x-bx, dy=foe.y-by;
  const len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len, px=-uy, py=ux;
  let placed=0;
  // 1) Approach line across the attack vector (longer than the old 7).
  for(let i=-6;i<=6&&placed<13;i++){
    const tx=Math.round(bp.x+ux*11+px*i), ty=Math.round(bp.y+uy*11+py*i);
    if(aiBuildAt('wall',pid,tx,ty)) placed++;
  }
  // 2) Base ring arc on the enemy-facing side: walls hugging the base at
  // radius 10, covering +/-50 degrees around the approach vector.
  for(let a=-50;a<=50&&placed<26;a+=10){
    const rad=a*Math.PI/180, ca=Math.cos(rad), sa=Math.sin(rad);
    const vx=ux*ca-uy*sa, vy=ux*sa+uy*ca;
    const tx=Math.round(bp.x+vx*10), ty=Math.round(bp.y+vy*10);
    if(aiBuildAt('wall',pid,tx,ty)) placed++;
  }
  // 3) Expo outposts: each extra command center gets a short wall line.
  const expos=G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='command'&&b.progress>=1
    &&dist2(b.cx,b.cy,bx,by)>(6*TILE)*(6*TILE));
  for(const ex of expos){
    if(placed>=32) break;
    const exx=ex.cx/TILE, eyy=ex.cy/TILE;
    for(let i=-2;i<=2&&placed<32;i++){
      const tx=Math.round(exx+px*i), ty=Math.round(eyy+py*i);
      if(aiBuildAt('wall',pid,tx,ty)) placed++;
    }
  }
  if(placed>0) st.fortT=G.time+100;
}
// Targeted scout dispatch (used to reveal expansion sites before building).
// Redirects the current scout if it's just sweeping — expansion scouting
// must not stall behind a useless patrol.
function aiSendScoutTo(pid,x,y){
  const st=AI[pid];
  let scout=st.scoutActive?G.units.find(u=>u.id===st.scoutActive&&!u.dead):null;
  if(!scout){
    scout=G.units.find(u=>!u.dead&&u.owner===pid&&!u.loadedBy&&
      (u.type==='sparrow'||u.type==='reaper'||u.type==='trooper')&&u.ord.t==='idle');
    if(scout) st.scoutActive=scout.id;
  }
  if(!scout) return;
  st.scoutActive=scout.id;
  orderMove(scout,x,y,false);
}
// Nearest VISIBLE enemy worker (honest intel) — harassment targeting.
function nearestEnemyWorkers(pid){
  const f=fog[pid], bp=G.basePos[pid];
  let best=null,bd=1e18;
  for(const u of G.units){
    if(u.dead||!u.def.worker||!isEnemy(u.owner,pid)) continue;
    if(f[tIdx(px2t(u.x),px2t(u.y))]<1) continue;
    const d=dist2(u.x,u.y,bp.x*TILE,bp.y*TILE);
    if(d<bd){ bd=d; best=u; }
  }
  return best;
}
// All SCOUTED enemy bases, nearest first (honest intel) — for multi-prong waves.
function scoutedEnemyBases(pid){
  const st=AI[pid], bp=G.basePos[pid];
  st.scouted=st.scouted||{};
  const out=[];
  for(let i=0;i<G.players.length;i++){
    if(i===pid||!isEnemy(i,pid)||!st.scouted[i]) continue;
    const eb=G.basePos[i]; if(!eb) continue;
    out.push({owner:i,x:eb.x*TILE, y:eb.y*TILE,
      d:(eb.x-bp.x)*(eb.x-bp.x)+(eb.y-bp.y)*(eb.y-bp.y)});
  }
  out.sort((a,b)=>a.d-b.d);
  return out;
}
/* Bud's smarter AI: spread workers across resource nodes instead of piling
   everyone onto the closest one. Returns the least-crowded node of a type. */
function leastCrowdedNode(pid,type,maxD){
  const bp=aiBuildAnchor(pid); if(!bp) return null;
  const bx=bp.x*TILE, by=bp.y*TILE, md=(maxD*TILE)*(maxD*TILE);
  let best=null,bw=1e9,bd=1e18;
  for(const r of G.resources){
    if(r.type!==type||r.amount<=0) continue;
    const d=dist2(r.x,r.y,bx,by);
    if(d>md) continue;
    let w=0;
    for(const u of G.units){
      if(u.dead||u.owner!==pid||!u.def.worker||u.loadedBy) continue;
      if(u.ord.t==='gather'&&u.ord.res===r) w++;
    }
    if(w<bw||(w===bw&&d<bd)){ bw=w; bd=d; best=r; }
  }
  return best;
}
/* Ordered enemy policy: DEFEND > RECOVER > COUNTER > 30-minute HOLD > PREPARE/SCOUT > ASSAULT.
   The counter phase is a limited response to a real raid, not a full wave. */
function chooseEnemyStrategy(state){
  if(state.ownBaseThreat>0||state.recentAttack) return 'DEFEND';
  if(state.recentLosses>=1.5) return 'REBUILD';
  if(state.counterActive) return 'COUNTER';
  if(state.openingHold) return 'HOLD';
  if(state.ownWorkers<state.targetWorkers-2||state.ownResources<state.minimumStrategicReserve) return 'ECONOMY';
  if(state.enemyInformationUncertainty>0.45) return 'SCOUT';
  return 'ATTACK';
}
// Recent losses per player (RECOVER phase). Timestamps are game seconds.
const lossLog={};
function logLoss(owner, value){
  (lossLog[owner]=lossLog[owner]||[]).push({t:G.time, v:value});
}
function recentLosses(owner){
  const log=lossLog[owner]||[], cutoff=G.time-90;
  let s=0;
  for(const e of log) if(e.t>=cutoff) s+=e.v;
  return Math.min(s/500, 4); // normalize: 2000 value lost in 90s = max weight
}
/* ---------------- Ascendant Phase 2: Ascendant ally AI -------------------
   Self-contained routine for an Ascendant ally (2v2). Warps in buildings,
   trains the Ascendant roster, researches Vault upgrades, and sends simple
   attack waves. The Concord AI path is untouched — this branches instead. */
function aiAscendantAlly(pid, dt){
  const st=AI[pid]; if(!st||G.over||!G.running) return;
  const p=G.players[pid], bp=aiBuildAnchor(pid); if(!bp) return; // Build With Me: warp near the player's base
  const workers=G.units.filter(u=>!u.dead&&u.owner===pid&&u.def.worker&&!u.loadedBy);
  const army=G.units.filter(u=>!u.dead&&u.owner===pid&&!u.def.worker&&u.def.dmg>0&&!u.loadedBy);
  const done=t=>G.buildings.some(b=>!b.dead&&b.owner===pid&&b.type===t&&b.progress>=1);
  const pending=t=>G.buildings.some(b=>!b.dead&&b.owner===pid&&b.type===t&&b.progress<1);
  const skillMul=((ALLY_SKILLS[G.allySkill]||{}).mult||1); // higher = stronger ally
  const at=(t)=>aiBuildAt(t,pid,bp.x,bp.y);
  // 1. Workers: keep ~14 acolytes on the heartspire(s).
  const hearts=G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='heartspire'&&b.progress>=1);
  const wantW=14;
  for(const h of hearts) if(workers.length<wantW&&h.queue.length<2){ trainUnit(h,'acolyte',true); break; }
  // 2. Idle workers harvest; keep 2 on flux once the geyser is known.
  for(const w of workers){
    if(w.ord.t!=='idle') continue;
    const ore=leastCrowdedNode(pid,'ore',30);
    if(ore) orderGather(w,ore);
  }
  const fluxMiners=workers.filter(w=>w.ord.t==='gather'&&w.ord.res&&w.ord.res.type==='flux').length;
  if(fluxMiners<2){
    const oreMiner=workers.find(w=>w.ord.t==='gather'&&w.ord.res&&w.ord.res.type==='ore');
    const geyser=G.resources.find(r=>r.type==='flux'&&r.amount>0&&dist(r.x,r.y,bp.x*TILE,bp.y*TILE)<30*TILE);
    if(oreMiner&&geyser) orderGather(oreMiner,geyser);
  }
  // 3. Supply: spire whenever close to cap.
  if(p.supplyCap<500&&p.supplyUsed>=p.supplyCap-2&&!pending('supplyspire')) at('supplyspire');
  // 4. Build order: sanctum -> sky reliquary -> vault -> defenses -> conduit.
  if(!done('bladesanctum')&&!pending('bladesanctum')&&(G.time>45||workers.length>=6)) at('bladesanctum');
  else if(done('bladesanctum')&&!done('skyreliquary')&&!pending('skyreliquary')) at('skyreliquary');
  else if(done('skyreliquary')&&!done('resovault')&&!pending('resovault')) at('resovault');
  const nPy=G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='aegispylon').length;
  if(nPy<2&&done('bladesanctum')&&!pending('aegispylon')) at('aegispylon');
  if(G.time>420&&!done('warpconduit')&&!pending('warpconduit')) at('warpconduit');
  // Second sanctum when banking (more army).
  const nSanc=G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='bladesanctum').length;
  if(done('skyreliquary')&&nSanc<2&&!pending('bladesanctum')&&p.ore>600) at('bladesanctum');
  // 5. Research the Vault upgrades in order.
  const vault=G.buildings.find(b=>!b.dead&&b.owner===pid&&b.type==='resovault'&&b.progress>=1);
  if(vault&&!vault.research){
    for(const id of ['aegisplat','hardlight','resflow'])
      if(!hasUpgrade(pid,id)){ startResearch(vault,id); break; }
  }
  // 6. Train the army.
  const qCap=skillMul>=1?3:2;
  for(const b of G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='bladesanctum'&&b.progress>=1)){
    if(b.queue.length>=qCap) continue;
    const r=rng();
    trainUnit(b, r<0.38?'shard':r<0.62?'prism':r<0.78?'eclipse':r<0.9?'sentinel':'oracle', true);
  }
  for(const b of G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='skyreliquary'&&b.progress>=1)){
    if(b.queue.length>=2) continue;
    trainUnit(b, rng()<0.6?'lancer':'monolith', true);
  }
  // 7. Attack waves: rally the army, then send it (keep 4 defenders home).
  // Better allies wave faster and with more of the army.
  st.ascWaveT=(st.ascWaveT===undefined?150:st.ascWaveT)-dt*skillMul;
  if(st.ascWaveT<=0){
    st.ascWaveT=150;
    const foe=nearestEnemyBase(pid);
    const keepHome=skillMul>=1.25?2:4;
    if(foe&&army.length>keepHome+2){
      const attackers=army.filter(u=>u.ord.t==='idle'||u.ord.t==='attackmove').slice(0,army.length-keepHome);
      for(const u of attackers) orderMove(u,foe.x,foe.y,true);
    }
  }
}
// Ascendant enemy AI: full macro AI playing the Ascendant race. Same architectural
// style as aiAscendantAlly (warp-in economy, Aegis units) but enemy-flavored:
// WAR_DIFF scaling, AI_PERSONALITY pacing, escalating attack waves at the player.
function aiAscendantEnemy(pid, dt){
  const st=AI[pid]; if(!st||G.over||!G.running) return;
  const p=G.players[pid], bp=G.basePos[pid]; if(!bp) return;
  const workers=G.units.filter(u=>!u.dead&&u.owner===pid&&u.def.worker&&!u.loadedBy);
  const army=G.units.filter(u=>!u.dead&&u.owner===pid&&!u.def.worker&&u.def.dmg>0&&!u.loadedBy);
  const done=t=>G.buildings.some(b=>!b.dead&&b.owner===pid&&b.type===t&&b.progress>=1);
  const pending=t=>G.buildings.some(b=>!b.dead&&b.owner===pid&&b.type===t&&b.progress<1);
  const at=(t)=>aiBuildAt(t,pid,bp.x,bp.y);
  const pers=AI_PERSONALITY[st.personality]||AI_PERSONALITY.balanced;
  const diff=WAR_DIFF[G.warDiff||'normal'];
  const isHard=G.warDiff==='hard';
  // Escalation: same convention as the Concord aiThink (capped — Bud's rule).
  st.aggroT=(st.aggroT||0)+(dt||0.5);
  if(st.aggroT>=60){ st.aggroT=0;
    if(st.dmgTaken<400){ st.aggro=Math.min(diff.aggroCap,(st.aggro||0)+1); }
    else { st.aggro=Math.max(0,(st.aggro||0)-1); }
    st.dmgTaken=0; }
  const aggroMul=1+(st.aggro||0)*0.15;
  const macroMode=isHard;
  // 1. Workers: saturate heartspires (hard saturates properly, others use personality count).
  const hearts=G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='heartspire'&&b.progress>=1);
  const wantW=macroMode?6+Math.max(0,hearts.length-1)*2:pers.wantWorkers;
  for(const h of hearts) if(workers.length<wantW&&h.queue.length<3){ trainUnit(h,'acolyte',true); break; }
  // Bud 2026-10-14: AI researches Harvest upgrades (proactive bug hunt — 6-worker
  // economy needs the multipliers or AI income collapses).
  const hs0=hearts.find(b=>!b.research);
  if(hs0&&G.time>180){
    for(const hid of ['harv1','harv2','harv3'])
      if(!hasUpgrade(pid,hid)){ startResearch(hs0,hid); break; }
  }
  // 2. Idle workers harvest; keep 2 on flux once the geyser is known.
  for(const w of workers){
    if(w.ord.t!=='idle') continue;
    const ore=leastCrowdedNode(pid,'ore',30);
    if(ore) orderGather(w,ore);
  }
  const fluxMiners=workers.filter(w=>w.ord.t==='gather'&&w.ord.res&&w.ord.res.type==='flux').length;
  // Ascendant enemy AI: every combat unit costs flux, so scale flux miners with
  // production (the flat 2-miner rule starves the whole army).
  const nProdAsc=G.buildings.filter(b=>!b.dead&&b.owner===pid&&(b.type==='bladesanctum'||b.type==='skyreliquary')&&b.progress>=1).length;
  const wantFlux=Math.min(5,2+nProdAsc);
  let fmCount=fluxMiners;
  while(fmCount<wantFlux){
    const oreMiner=workers.find(w=>w.ord.t==='gather'&&w.ord.res&&w.ord.res.type==='ore');
    const geyser=G.resources.find(r=>r.type==='flux'&&r.amount>0&&dist(r.x,r.y,bp.x*TILE,bp.y*TILE)<30*TILE);
    if(!oreMiner||!geyser) break;
    orderGather(oreMiner,geyser); fmCount++;
  }
  // 3. Supply: spire whenever close to cap (never past 500).
  if(p.supplyCap<500&&p.supplyUsed>=p.supplyCap-2&&!pending('supplyspire')) at('supplyspire');
  // 4. Build order: sanctum -> sky reliquary -> vault -> defenses scale -> conduit.
  if(!done('bladesanctum')&&!pending('bladesanctum')&&(G.time>45||workers.length>=6)) at('bladesanctum');
  else if(done('bladesanctum')&&!done('skyreliquary')&&!pending('skyreliquary')) at('skyreliquary');
  else if(done('skyreliquary')&&!done('resovault')&&!pending('resovault')) at('resovault');
  // Defense: pylons scale like Concord turrets — turtlers fortify hardest,
  // hard escalates with game time (Bud's defense round, same convention).
  const wantPy=(st.personality==='turtler'?3:(done('skyreliquary')?2:1))
    +(macroMode?Math.min(3,Math.floor(Math.max(0,G.time-300)/240)):0);
  const nPy=G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='aegispylon').length;
  if(nPy<wantPy&&done('bladesanctum')&&!pending('aegispylon')) at('aegispylon');
  if(G.time>420&&!done('warpconduit')&&!pending('warpconduit')) at('warpconduit');
  // Second sanctum when banking (more army throughput).
  const nSanc=G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='bladesanctum').length;
  if(done('skyreliquary')&&nSanc<2&&!pending('bladesanctum')&&p.ore>600) at('bladesanctum');
  // Expansion: second heartspire at a natural (hard/expander earlier).
  if(hearts.length<2&&G.time>(macroMode||st.personality==='expander'?360:540)&&!pending('heartspire')){
    const site=aiExpoSite(pid);
    if(site) aiBuildAt('heartspire',pid,site.x,site.y);
  }
  // 5. Research the Vault upgrades in order.
  const vault=G.buildings.find(b=>!b.dead&&b.owner===pid&&b.type==='resovault'&&b.progress>=1);
  if(vault&&!vault.research){
    for(const id of ['aegisplat','hardlight','resflow'])
      if(!hasUpgrade(pid,id)){ startResearch(vault,id); break; }
  }
  // 6. Train the army: shards front, prisms behind, eclipse/sentinel/oracle support.
  const qCap=macroMode?3:2;
  for(const b of G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='bladesanctum'&&b.progress>=1)){
    if(b.queue.length>=qCap) continue;
    const r=rng();
    trainUnit(b, r<0.36?'shard':r<0.60?'prism':r<0.74?'eclipse':r<0.86?'sentinel':'oracle', true);
  }
  for(const b of G.buildings.filter(b=>!b.dead&&b.owner===pid&&b.type==='skyreliquary'&&b.progress>=1)){
    if(b.queue.length>=2) continue;
    const r=rng(), late=G.time>600;
    trainUnit(b, late&&r<0.12?'judicator':(r<0.55?'lancer':'monolith'), true);
  }
  // 7. Eclipse harassment is delayed until after the enemy opening hold.
  if(st.personality==='aggressor'&&!st.eclipseHarass&&G.time>=(st.holdSeconds||AI_OPENING_HOLD_SECONDS)){
    const ecs=army.filter(u=>u.type==='eclipse'&&!u.dead&&(u.ord.t==='idle'||u.ord.t==='attackmove'));
    const foe=nearestEnemyBase(pid);
    if(ecs.length>=2&&foe){ st.eclipseHarass=true;
      for(const e of ecs.slice(0,2)) orderMove(e,foe.x+rand(-80,80),foe.y+rand(-80,80),true); }
  }
  // Shared phase and local-response logic for Ascendant opponents.
  const ascHomeX=bp.x*TILE, ascHomeY=bp.y*TILE;
  const ascThreats=unitsNear(ascHomeX,ascHomeY,24*TILE,u=>isEnemy(u.owner,pid));
  if(ascThreats.length||G.time-(st.lastDefenseT??-1e9)<18) st.phase='DEFEND';
  else if(recentLosses(pid)>=1.5) st.phase='RECOVER';
  else if(st.counterWatch) st.phase='COUNTER';
  else st.phase=G.time<(st.holdSeconds||AI_OPENING_HOLD_SECONDS)?'HOLD':'ASSAULT';
  aiTryCounterattack(pid,army,ascHomeX,ascHomeY,pers.defenders,ascThreats,false);
  // 8. Planned attack waves begin after the opening hold (unless a counterattack triggers sooner).
  st.waveT=(st.waveT===undefined?(st.holdSeconds||AI_OPENING_HOLD_SECONDS):st.waveT)-(dt||0.5);
  if(st.waveT<=0){
    st.waveNum=(st.waveNum||0)+1;
    const waveCap=isHard?48:34;
    const size=Math.min(Math.round((4+st.waveNum*3+pers.waveBonus)*aggroMul*diff.waveMul),waveCap);
    const availW=army.filter(u=>(u.ord.t==='idle'||u.ord.t==='attackmove')&&!u.recalled);
    const keepHome=Math.min(pers.defenders,availW.length);
    const attackers=availW.slice(0,Math.max(0,Math.min(size,availW.length-keepHome)));
    if(attackers.length>=4&&G.time>=(st.holdSeconds||AI_OPENING_HOLD_SECONDS)&&st.phase==='ASSAULT'){
      const tgt=nearestScoutedEnemyBase(pid)||nearestEnemyBase(pid);
      if(tgt){
        attackers.forEach(u=>orderMove(u,tgt.x+rand(-120,120),tgt.y+rand(-120,120),true));
        st.wavesSent=(st.wavesSent||0)+1;
        flashHint('⚠ Enemy attack wave inbound!'); AudioSys.error();
      }
    }
    st.waveT=pers.waveT;
  }
}
function aiTryCounterattack(pid,army,homeX,homeY,defenderCount,nearbyThreats,isAlly){
  const st=AI[pid]; if(!st) return false;
  if(st.counterWatch){
    const watch=st.counterWatch, survivors=[];
    for(const id of watch.ids){ const u=G.units.find(v=>v.id===id&&!v.dead); if(u) survivors.push(u); }
    if(survivors.length<=watch.start*0.4){
      for(const u of survivors) orderMove(u,homeX+rand(-70,70),homeY+rand(-70,70));
      st.counterWatch=null;
    } else if(G.time-watch.t>150) st.counterWatch=null;
  }
  const hit=st.lastAttacker;
  if(isAlly||!hit||G.time-hit.t>120||G.time-st.counterattackT<180) return false;
  if(nearbyThreats.length||G.time-st.lastDefenseT<12||st.threatDamage<20||st.phase==='RECOVER'||recentLosses(pid)>=1.5) return false;
  const radius2=(20*TILE)*(20*TILE), reserve=Math.max(3,Math.ceil(defenderCount*0.65));
  const ready=army.filter(u=>!u.dead&&!u.recalled&&(u.ord.t==='idle'||u.ord.t==='attackmove')&&
    dist2(u.x,u.y,homeX,homeY)<=radius2);
  if(ready.length<reserve+3) return false;
  const count=Math.min(8,Math.max(3,Math.floor((ready.length-reserve)*0.5)));
  const group=ready.slice(0,count);
  const knownBase=scoutedEnemyBases(pid).find(base=>base.owner===hit.owner);
  const target=knownBase||{x:hit.x,y:hit.y};
  for(const u of group) orderMove(u,target.x+rand(-80,80),target.y+rand(-80,80),true);
  st.counterattackT=G.time; st.threatDamage=0; st.lastAttacker=null; st.phase='COUNTER';
  st.counterWatch={ids:new Set(group.map(u=>u.id)),start:group.length,t:G.time};
  flashHint('⚠ Enemy counterattack!'); AudioSys.error();
  return true;
}
function aiThink(pid, dt){
  if(G.over||!G.running) return;
  const st=AI[pid]; if(!st) return;
  const p=G.players[pid];
  const workers=G.units.filter(u=>!u.dead&&u.owner===pid&&u.def.worker&&!u.loadedBy);
  const army=G.units.filter(u=>!u.dead&&u.owner===pid&&!u.def.worker&&u.def.dmg>0&&!u.loadedBy);
  const done=t=>G.buildings.some(b=>!b.dead&&b.owner===pid&&b.type===t&&b.progress>=1);
  const pending=t=>G.buildings.some(b=>!b.dead&&b.owner===pid&&b.type===t&&b.progress<1);
  const bp=G.basePos[pid];
  const isAlly=(G.team[pid]||0)===0;
  const isHard=G.warDiff==='hard';
  // Ascendant Phase 2: an Ascendant ally runs its own dedicated routine —
  // the Concord build logic below is untouched.
  if(isAlly&&pid!==PID&&G.allyRace==='ascendant'){ aiAscendantAlly(pid,dt); return; }
  // Ascendant enemy AI: enemies flagged ascendant run the Ascendant macro AI.
  if(!isAlly&&pid!==PID&&((G.players[pid]&&G.players[pid].race)||'concord')==='ascendant'){
    aiAscendantEnemy(pid,dt); return; }
  // Bud 2026-10-11 macro overhaul: hard enemies + the ally build like real
  // players (saturate workers, multiple production buildings, spend the bank,
  // tech on a timeline). Easy/normal enemies keep the legacy economy below.
  const pers=AI_PERSONALITY[st.personality]||AI_PERSONALITY.balanced;
  const diff=WAR_DIFF[G.warDiff||'normal'];
  // Escalation: if nobody pressures this AI, it grows bolder (capped — Bud's rule).
  // Damage taken is accumulated in damageEnt. Every 60s of peace: +1 aggro (max 5).
  // Taking heat: aggro drops, so pressuring the AI keeps it in check.
  st.aggroT+=(dt||0.5);
  if(st.aggroT>=60){
    st.aggroT=0;
    if(st.dmgTaken<400){ st.aggro=Math.min(diff.aggroCap,st.aggro+1); }
    else { st.aggro=Math.max(0,st.aggro-1); }
    st.dmgTaken=0;
  }
  // Abandoned-construction recovery: a site its worker can't reach (walled in by
  // its own buildings) sat at 0% forever and blocked later builds of that type.
  // Half-built abandoned sites get a worker re-sent; 0%-progress sites idle for
  // ~30s are scrapped (cost refunded, spot remembered as bad) so a new site is chosen.
  st.siteT=(st.siteT||0)+(dt||0.5);
  if(st.siteT>=5){ st.siteT=0;
    for(const b of G.buildings){
      if(b.dead||b.owner!==pid||b.progress>=1) continue;
      if(b.progress>0){ // half-built and abandoned (builder died or was re-tasked): send a worker to finish it
        b.siteIdle=0;
        if(!G.units.some(u=>!u.dead&&u.owner===pid&&u.ord.t==='construct'&&u.ord.b===b)){
          const w=nearestAIWorker(b.cx,b.cy,pid); if(w){ w.ord={t:'construct',b}; setPathTo(w,b.cx,b.cy); } }
        continue; }
      b.siteIdle=(b.siteIdle||0)+5;
      if(b.siteIdle<30) continue;
      b.dead=true; freeBuilding(b); p.ore+=b.def.cost.ore; p.flux+=b.def.cost.flux;
      (st.bad=st.bad||[]).push({x:b.btx,y:b.bty});
      for(const u of G.units) if(!u.dead&&u.owner===pid&&((u.ord.t==='construct'&&u.ord.b===b)||(u.ord.t==='build'&&u.ord.btx===b.btx&&u.ord.bty===b.bty))) orderStop(u);
    } }

// Scout dispatch: send the fastest available unit on a recon sweep.
function aiSendScout(pid){
  const st=AI[pid];
  if(st.scoutActive) return;
  const bp=G.basePos[pid];
  const scout=G.units.find(u=>!u.dead&&u.owner===pid&&!u.loadedBy&&
    (u.type==='sparrow'||u.type==='reaper'||u.type==='trooper')&&u.ord.t==='idle');
  if(!scout) return;
  st.scoutActive=scout.id;
  // Sweep through the map center, then toward the farthest corner.
  const cx=MAP_W*TILE/2, cy=MAP_H*TILE/2;

// Nearest SCOUTED enemy base (honest intel). Falls back to nearest base only
// if we've seen nothing — and dispatches a scout to fix that.
function nearestScoutedEnemyBase(pid){
  const found=scoutedEnemyBases(pid);
  if(found.length) return {x:found[0].x, y:found[0].y};
  aiSendScout(pid);
  return nearestEnemyBase(pid); // last resort: strategic estimate
}
// Nearest base belonging to an enemy team (for AI attack targeting).
function nearestEnemyBase(pid){
  const bp=G.basePos[pid]; let best=null,bd=1e18;
  for(let i=0;i<G.players.length;i++){
    if(i===pid||!isEnemy(i,pid)) continue;
    const eb=G.basePos[i]; if(!eb) continue;
    const d=(eb.x-bp.x)*(eb.x-bp.x)+(eb.y-bp.y)*(eb.y-bp.y);
    if(d<bd){ bd=d; best={x:eb.x*TILE,y:eb.y*TILE}; }
  }
  return best;
}

let FPS=60;
// Ascendant Phase 1: Aegis shield regen, phase/slow/aura timers.
function updateAegis(e,dt){
  if(e.dead) return;
  if(e.auraT>0) e.auraT-=dt;
  if(e.phaseT>0) e.phaseT-=dt;
  if(e.phaseCd>0) e.phaseCd-=dt;
  if(e.slowT>0){ e.slowT-=dt; if(e.slowT<=0) e.slowMul=1; }
  if(e.warpT>0) e.warpT-=dt;
  if(e.maxShield>0&&e.shield<e.maxShield&&(G.time-e.lastDmgT>6||e.auraT>0)){
    // Full recharge in ~12s; Sentinel aura lets shields trickle back even under fire.
    // Ascendant Phase 2: Resonance Flow speeds regen 30%.
    const mult=e.auraT>0?0.5:1, flowMul=hasUpgrade(e.owner,'resflow')?1.3:1;
    e.shield=Math.min(e.maxShield,e.shield+(e.maxShield/12)*mult*flowMul*dt);
  }
}
// Ascendant Phase 1: buildings warp in over def.warp seconds — no worker needed.
function updateWarp(b,dt){
  b.warpT-=dt;
  const hw=b.def.size*TILE/2;
  if(rng()<dt*10) addParticle(b.cx+rand(-hw,hw),b.cy+rand(-hw,0),rand(-10,10),rand(-50,-15),0.6,3,'#7fe8ff',80);
  if(b.warpT<=0){
    b.warping=false; b.progress=1; b.hp=b.maxhp;
    if(b.maxShield) b.shield=b.maxShield;
    explode(b.cx,b.cy,1.5,'#9fe8ff');
    if(b.owner===PID){ flashHint(b.def.name+' operational'); AudioSys.build(); }
  }
}
function tick(dt){
  G.tick++; G.time+=dt;
  rebuildHash();
  for(const u of G.units){ updateUnit(u,dt); updateAegis(u,dt); }
  for(const b of G.buildings){
    if(b.warping&&!b.dead){ updateWarp(b,dt); continue; } // warping: no production yet
    updateAegis(b,dt); updateProduction(b,dt); updateBuildingCombat(b,dt);
  }
  updateProjectiles(dt);
  updateNukes(dt);
  if(G.nukeFlash>0) G.nukeFlash=Math.max(0,G.nukeFlash-dt*0.7);
  // Particles.
  for(let i=G.particles.length-1;i>=0;i--){ const pt=G.particles[i];
    pt.life-=dt; if(pt.life<=0){ G.particles.splice(i,1); continue; }
    pt.vy+=(pt.grav||0)*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; }
  for(let i=G.markers.length-1;i>=0;i--){ G.markers[i].t-=dt;
    if(G.markers[i].t<=0) G.markers.splice(i,1); }
  if(hintT>0) hintT-=dt;
  if(shakeT>0){ shakeT-=dt; if(shakeT<=0) shakeMag=0; }
  // Cleanup dead entities.
  if(G.tick%10===0){
    G.units=G.units.filter(u=>!(u.dead&&u.deathT<=0));
    G.buildings=G.buildings.filter(b=>!b.dead);
  }
  if(G.tick%15===0) updateFog();
  // Ambient atmosphere: faint dust motes drift through the visible view.
  if(G.tick%9===0 && G.running && !G.over){
    const vx0=cam.x-VW/cam.zoom/2, vx1=cam.x+VW/cam.zoom/2,
          vy0=cam.y-VH/cam.zoom/2, vy1=cam.y+VH/cam.zoom/2;
    const ax=vx0+Math.random()*(vx1-vx0), ay=vy0+Math.random()*(vy1-vy0);
    const moteCol=currentTerrainArt().vein||'#9fdcff';
    addParticle(ax,ay,(Math.random()-0.5)*14,-8-Math.random()*10,
      2.5+Math.random()*2,1.6,moteCol,-4);
  }
  if(G.tick%AI_THINK_INTERVAL_TICKS===0){ // supply caps + AI on a shared half-second cadence
    for(const pl of G.players){
      pl.supplyCap=Math.min(500, G.buildings
        .filter(b=>!b.dead&&b.owner===pl.id&&b.progress>=1)
        .reduce((s,b)=>s+(b.type==='command'||b.type==='heartspire'||b.type==='hive'?11:(b.type==='depot'||b.type==='supplyspire'||b.type==='nestmound')?8:0),0));
    }
    // Ascendant Phase 1: Sentinel aura — nearby shielded allies regen even under fire.
    for(const s of G.units){
      if(s.dead||s.type!=='sentinel') continue;
      const r=(s.def.auraR||6)*TILE, r2=r*r;
      for(const a of G.units){
        if(a.dead||a===s||a.owner!==s.owner||!a.maxShield) continue;
        if(dist2(s.x,s.y,a.x,a.y)<=r2) a.auraT=1;
      }
    }
    // Ascendant Phase 2: Aegis Pylon — nearby Ascendant buildings share shield regen.
    for(const py of G.buildings){
      if(py.dead||py.type!=='aegispylon'||py.progress<1||py.warping) continue;
      const r=6*TILE, r2=r*r;
      for(const a of G.buildings){
        if(a.dead||a===py||a.owner!==py.owner||!a.maxShield) continue;
        if(dist2(py.cx,py.cy,a.cx,a.cy)<=r2) a.auraT=1;
      }
    }
    if(G.mode!=='campaign'&&G.mode!=='survival'){
      for(const pl of G.players) if(pl.isAI) aiThink(pl.id, dt);
    } // campaign missions drive the enemy via scripts
  }
  if(G.mode==='campaign'&&G.m&&!G.over){ G.m.t+=dt; if(G.m.def.update) G.m.def.update(dt); }
  if(G.mode==='survival'&&!G.over){ survivalUpdate(dt); }
  if(G.mode==='war'&&!G.over){
    warUpdate(dt);
  }
}
function updateCamera(dt){
  if(!G.running||G.over||G.paused) return;
  const sp=520*dt*(keys.has('Shift')?2:1);
  let mx=0,my=0;
  if(keys.has('ArrowLeft'))mx-=1; if(keys.has('ArrowRight'))mx+=1;
  if(keys.has('ArrowUp'))my-=1; if(keys.has('ArrowDown'))my+=1;
  // Edge pan (not over minimap; never from stale touch positions).
  if(mouse.inCanvas && mouse.hasMoved && !touchUsed){
    const r=mmCanvas.getBoundingClientRect();
    const overMM=mouse.x>=r.left&&mouse.x<=r.right&&mouse.y>=r.top&&mouse.y<=r.bottom;
    if(!overMM){
      const m=16;
      if(mouse.x<m)mx-=1; if(mouse.x>VW-m)mx+=1;
      if(mouse.y<m)my-=1; if(mouse.y>VH-m)my+=1;
    }
  }
  if(mx||my){ cam.x+=mx*sp; cam.y+=my*sp; clampCam(); }
}
let lastT=0, acc=0; const STEP=1/60;
function frame(t){
  requestAnimationFrame(frame);
  const now=t/1000;
  let dt=Math.min(0.1, now-(lastT||now)); lastT=now;
  if(dt>0) FPS=Math.round(FPS*0.95+(1/dt)*0.05);
  if(G.running&&!G.paused&&!G.over){
    acc+=dt*G.speed;
    let n=0;
    while(acc>=STEP&&n<5){ tick(STEP); acc-=STEP; n++; }
    if(n===5) acc=0;
  }
  if(G.over&&!G.resultRecorded){ recordGameResult(); G.resultRecorded=true; } // Bud's W/L + medals
  updateCamera(dt);
  render();
}

}

function survWaveComp(n){
  const comp=[];
  const sk=2+Math.floor(n*1.2), sp=Math.floor((n-1)/2),
        ma=Math.floor((n-3)/3), ha=Math.floor((n-4)/3);
  for(let i=0;i<sk;i++) comp.push('skitter');
  for(let i=0;i<Math.max(0,sp);i++) comp.push('spitter');
  for(let i=0;i<Math.max(0,ma);i++) comp.push('mauler');
  for(let i=0;i<Math.max(0,ha);i++) comp.push('harpy');
  return comp;
}
function survSpawnWave(){
  const s=G.surv; s.wave++;
  const comp=survWaveComp(s.wave);
  const bp=G.basePos[PID], tx=bp.x*TILE, ty=bp.y*TILE;
  const edges=[];
  for(let k=0;k<2;k++){
    const side=Math.floor(Math.random()*4);
    let ex,ey;
    if(side===0){ ex=rand(10,MAP_W-10); ey=8; }
    else if(side===1){ ex=rand(10,MAP_W-10); ey=MAP_H-8; }
    else if(side===2){ ex=8; ey=rand(10,MAP_H-10); }
    else { ex=MAP_W-8; ey=rand(10,MAP_H-10); }
    edges.push([ex,ey]);
  }
  const hpMul=1+Math.max(0,s.wave-5)*0.08;
  comp.forEach((t,i)=>{
    const e=edges[i%edges.length], def=unitDef(t);
    const hp=Math.round(def.hp*hpMul);
    const u=spawnUnit(t,EID,(e[0]+rand(-3,3))*TILE,(e[1]+rand(-3,3))*TILE,
      hpMul>1?{hp:hp,maxhp:hp}:null);
    orderMove(u,tx,ty,true);
  });
  flashHint('WAVE '+s.wave+' — '+comp.length+' Swarm inbound!');
  AudioSys.blip(220,110,0.8,'sawtooth',0.6);
}
function survivalUpdate(dt){
  const s=G.surv; if(!s||G.over) return;
  const pid=PID, pl=G.players[pid];
  s.nextT-=dt;
  if(!s.warned && s.nextT<=SURV_WARN_TIME && s.nextT>0){
    s.warned=true;
    flashHint('WAVE '+(s.wave+1)+' INCOMING — build defenses!');
    AudioSys.blip(440,440,0.3,'square',0.4);
  }
  if(s.nextT<=0){
    survSpawnWave();
    s.nextT=SURV_WAVE_TIME; s.warned=false;
  }
  const ccAlive=G.buildings.some(b=>!b.dead&&b.owner===pid&&b.type==='command');
  const anyB=G.buildings.some(b=>!b.dead&&b.owner===pid);
  // Command Center trickle: a wiped player can always rebuild pioneers.
  if(ccAlive) pl.ore+=1.0*dt;
  const pUnitsAlive=G.units.some(u=>!u.dead&&u.owner===pid);
  // Soft-lock: no units, no CC to rebuild from, can't afford a pioneer.
  if(!pUnitsAlive&&!ccAlive&&pl.ore<50){ doSurvLose(s); return; }
  if(!ccAlive||!anyB){ doSurvLose(s); }
}

// ---- Bud 2026-10-11: symmetric random map generation (war mode) ----
// 180-degree rotational symmetry: (x,y) <-> (W-1-x,H-1-y). Both teams always
// get identical terrain, so no spawn slot is advantaged (StarCraft standard).
const ROTX=x=>MAP_W-1-x, ROTY=y=>MAP_H-1-y;
function paintMirror(x,y,fn){ fn(x,y); fn(ROTX(x),ROTY(y)); }
function setMountain(tx,ty){ if(!inMap(tx,ty))return; const i=tIdx(tx,ty); mapTiles[i]=1; blocked[i]=1; }
function setForestT(tx,ty){ if(!inMap(tx,ty))return; const i=tIdx(tx,ty); if(mapTiles[i]===0) mapTiles[i]=5; }
// Wandering mountain ridge: paints a width-wobbling range, mirrored.
function mountainRidge(sx,sy,len){
  let x=sx,y=sy,dx=choice([-1,1]),dy=choice([-1,1]);
  for(let i=0;i<len;i++){
    const w=randi(1,3);
    for(let oy=-w;oy<=w;oy++)for(let ox=-w;ox<=w;ox++)
      if(ox*ox+oy*oy<=(w+0.4)*(w+0.4)) paintMirror(x+ox,y+oy,setMountain);
    if(rng()<0.4){ dx=randi(-1,1); dy=randi(-1,1); if(!dx&&!dy)dx=1; }
    x=clamp(x+dx,10,MAP_W-11); y=clamp(y+dy,10,MAP_H-11);
  }
}
// Meandering river with bridge gaps; mirrored twin keeps symmetry.
function riverRun(vertical){
  let p=randi(28,MAP_W-29);
  const gaps=[randi(18,52),randi(74,108)], lim=vertical?MAP_H:MAP_W;
  for(let q=8;q<lim-8;q++){
    p=clamp(p+randi(-2,2),12,(vertical?MAP_W:MAP_H)-13);
    if(gaps.some(g=>Math.abs(q-g)<4)) continue; // bridge crossing
    for(let w=-2;w<=2;w++){ if(vertical) paintMirror(p+w,q,setWater); else paintMirror(q,p+w,setWater); }
  }
}
function forestPatch(cx,cy,r){
  for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)
    if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=(r+0.6)*(r+0.6)) paintMirror(x,y,setForestT);
}
// Clear mountain/forest around an expansion pad (ore/geyser stay).
function clearExpoPad(x,y){
  for(let oy=-6;oy<=6;oy++)for(let ox=-6;ox<=6;ox++){
    const tx=x+ox,ty=y+oy; if(!inMap(tx,ty))continue;
    const i=tIdx(tx,ty);
    if(mapTiles[i]===1||mapTiles[i]===5){ mapTiles[i]=0; blocked[i]=0; }
  }
}
function tileWalkableConn(tx,ty){ const t=mapTiles[tIdx(tx,ty)]; return t!==1&&t!==4; }
// BFS: every spawn must reach every other spawn for ground units.
function spawnsConnected(sp){
  const seen=new Uint8Array(MAP_W*MAP_H), q=[tIdx(sp[0].x,sp[0].y)]; seen[q[0]]=1;
  const NB=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){ const c=q.pop(),cx=c%MAP_W,cy=(c/MAP_W)|0;
    for(let k=0;k<4;k++){ const nx=cx+NB[k][0],ny=cy+NB[k][1];
      if(!inMap(nx,ny))continue; const ni=tIdx(nx,ny);
      if(seen[ni]||!tileWalkableConn(nx,ny))continue; seen[ni]=1; q.push(ni); } }
  return sp.every(p=>seen[tIdx(p.x,p.y)]);
}
function tryGenWarMap(){
  mapTiles.fill(0); blocked.fill(0); elev.fill(0);
  for(let i=0;i<MAP_W*MAP_H;i++) shade[i]=randi(0,3);
  const nR=randi(2,4);
  for(let k=0;k<nR;k++) mountainRidge(randi(20,44),randi(20,44),randi(18,34));
  const nRv=randi(1,2);
  for(let k=0;k<nRv;k++) riverRun(rng()<0.5);
  const nF=randi(3,6);
  for(let k=0;k<nF;k++) forestPatch(randi(16,48),randi(16,48),randi(3,7));
  for(let k=0;k<10;k++){ const cx=randi(10,54),cy=randi(10,54),r=randi(2,3);
    for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)
      if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r) paintMirror(x,y,setMountain); }
  // Expansion sites: mirrored pairs in the midfield, >=30 apart otherwise.
  WAR_EXPOS.length=0;
  const spots=[]; let guard=0; const nExpo=randi(2,3);
  while(spots.length<nExpo&&guard++<60){
    const x=randi(30,62),y=randi(30,97);
    if(spots.some(p=>Math.abs(p.x-x)+Math.abs(p.y-y)<30)) continue;
    spots.push({x,y});
  }
  for(const p of spots){
    clearExpoPad(p.x,p.y);
    addOreField(p.x-2,p.y,6); addFluxGeyser(p.x+3,p.y+1);
    WAR_EXPOS.push({x:p.x,y:p.y});
    const qx=ROTX(p.x), qy=ROTY(p.y); // exact rotated twin
    clearExpoPad(qx,qy);
    addOreField(qx+2,qy,6,-1,-1); addFluxGeyser(qx-3,qy-1);
    WAR_EXPOS.push({x:qx,y:qy});
  }
  // Spawn corners: rotational pairs are (0,1) and (2,3).
  const ci=randi(13,18);
  const corners=[{x:ci,y:MAP_H-1-ci},{x:MAP_W-1-ci,y:ci},
                 {x:MAP_W-1-ci,y:MAP_H-1-ci},{x:ci,y:ci}];
  const mirror=[false,true,false,true]; // c1=ROT(c0), c3=ROT(c2)
  G.basePos=[];
  for(let k=0;k<4;k++){ placeBaseKit(corners[k].x,corners[k].y,mirror[k]); G.basePos.push({x:corners[k].x,y:corners[k].y}); }
  return spawnsConnected(corners);
}
function genWarMap(){
  // Fresh random symmetric map; retry if terrain walls a spawn in.
  for(let t=0;t<10;t++){ if(tryGenWarMap()) return; }
  // Fallback (should never trigger): open map, fixed corners.
  mapTiles.fill(0); blocked.fill(0); elev.fill(0);
  for(let i=0;i<MAP_W*MAP_H;i++) shade[i]=randi(0,3);
  for(let i=0;i<22;i++) setRockCluster(randi(6,MAP_W-7), randi(6,MAP_H-7), randi(2,4));
  const corners=[ {bx:16,by:108}, {bx:108,by:16}, {bx:108,by:108}, {bx:16,by:16} ];
  G.basePos=[]; WAR_EXPOS.length=0;
  for(const c of corners){
    for(let y=c.by-8;y<=c.by+8;y++) for(let x=c.bx-8;x<=c.bx+8;x++){
      if(inMap(x,y)){ mapTiles[tIdx(x,y)]=0; blocked[tIdx(x,y)]=0; } }
    addOreField(c.bx-4, c.by+4, 8);
    addFluxGeyser(c.bx+4, c.by-2);
    G.basePos.push({x:c.bx, y:c.by});
  }
  WAR_EXPOS.push({x:62,y:60},{x:62,y:68});
  addOreField(62,60,6); addFluxGeyser(66,64);
  addOreField(62,68,6); addFluxGeyser(58,64);
}
const AI_COLORS=['#c832c8','#ff7a2f','#b8ff2f','#ff2f6e'];
function setupWar(nEnemies, withAlly){
  clearSave(); resetState(); maybeShowInstallHint();
  // Ascendant Phase 2: race selections from the race-select screen (?race=ascendant still overrides for debug).
  G.playerRace=(G.raceSel&&G.raceSel.race)||'concord';
  G.allyRace=(G.raceSel&&G.raceSel.allyRace)||'concord';
  G.allySkill=(G.raceSel&&G.raceSel.allySkill)||'regular';
  // Ascendant enemy AI: per-enemy race from the race-select screen.
  G.enemyRaces=((G.raceSel&&G.raceSel.enemyRaces)||[]).slice();
  try{ if(new URLSearchParams(location.search).get('race')==='ascendant') G.playerRace='ascendant'; }catch(e){}
  if(G.playerRace==='ascendant'){ G.players[0].name='Ascendant'; G.players[0].color='#e8c86a'; }
  if(G.playerRace==='swarm'){ G.players[0].name='Swarm'; G.players[0].color='#c832c8'; }
  G.players[0].race=G.playerRace;
  G.mode='war'; G.screen='game'; G.running=true; G.over=null; G.mIdx=-1;
  reseedForNewGame(); // fresh random symmetric map every game (seed in HUD)
  genWarMap(); buildMinimapTerrain();
  // Teams: 0 = player side, 1 = enemy side.
  G.team={0:0}; AI={};
  // Rebuild the player list cleanly: human + exactly the AIs we need.
  G.players.length=1;
  while(fog.length>1) fog.pop();
  const nAI=nEnemies+(withAlly?1:0);
  for(let i=1;i<=nAI;i++){
    const isAllyPlayer=withAlly&&i===nAI;
    const allyAsc=isAllyPlayer&&G.allyRace==='ascendant';
    const enemyAsc=!isAllyPlayer&&(G.enemyRaces[i-1]||'concord')==='ascendant';
    G.players.push({ id:i, name:isAllyPlayer?(allyAsc?'Ally Ascendant':'Ally Concord'):(enemyAsc?'Enemy Ascendant '+i:'Enemy '+i),
      color:isAllyPlayer?(allyAsc?'#e8c86a':'#2fff9a'):(enemyAsc?'#e8c86a':AI_COLORS[(i-1)%AI_COLORS.length]),
      ore:220, flux:0, supplyUsed:0, supplyCap:11, upgrades:[], isAI:true,
      race:isAllyPlayer?G.allyRace:(enemyAsc?'ascendant':'concord') });
    fog.push(new Uint8Array(MAP_W*MAP_H));
    G.team[i]=isAllyPlayer?0:1;
    aiInitState(i);
  }
  // Bases: corners are rotational pairs (0,1) and (2,3) with identical terrain.
  // Enemies always take rotational twins/pairs of the human's corner, so every
  // occupied base has a symmetric counterpart (except 2v2's empty 4th corner).
  // No more same-spot-every-game: the human's corner is random.
  const assign={};
  const twinOf=c=>c===0?1:c===1?0:c===2?3:2;
  if(withAlly){
    // 2v2: player+ally take one random rotational pair, the enemy takes a
    // random corner of the other pair (one corner stays empty, as before).
    const pairAFirst=rng()<0.5;
    const humanPair=pairAFirst?[0,1]:[2,3], enemyPair=pairAFirst?[2,3]:[0,1];
    const hc=rng()<0.5?0:1;
    assign[0]=humanPair[hc];
    assign[nAI]=humanPair[1-hc]; // ally = pid nAI
    // Enemies take the other pair's corners (shuffled); overflow spills over.
    let ei=1;
    for(const c of shuffle(enemyPair.slice())){ if(ei>nEnemies) break; assign[ei++]=c; }
    for(let c=0;c<4&&ei<=nEnemies;c++){ if(!Object.values(assign).includes(c)) assign[ei++]=c; }
  } else if(nEnemies===1){
    // 1v1: enemy takes the rotational twin of the human's corner.
    const hc=randi(0,3);
    assign[0]=hc; assign[1]=twinOf(hc);
  } else if(nEnemies===2){
    // 1v2: enemies take both corners of the pair the human is not in.
    const hc=randi(0,3), otherPair=hc<2?[2,3]:[0,1];
    assign[0]=hc; assign[1]=otherPair[0]; assign[2]=otherPair[1];
  } else {
    // 1v3: every corner occupied.
    const hc=randi(0,3);
    assign[0]=hc; let e=1;
    for(let c=0;c<4;c++) if(c!==hc) assign[e++]=c;
  }
  const cornerPos=G.basePos.slice(0,4); // snapshot: loop overwrites G.basePos[pid] below
  for(let pid=0;pid<=nAI;pid++){
    const bp=cornerPos[assign[pid]];
    G.basePos[pid]={x:bp.x, y:bp.y};
    const mirrored=(assign[pid]===1||assign[pid]===3); // c1=ROT(c0), c3=ROT(c2)
    if(pid===0&&G.playerRace==='ascendant') mStartBaseAsc(bp.x,bp.y,mirrored);
    else if(pid===0&&G.playerRace==='swarm') mStartBaseSwarm(bp.x,bp.y,mirrored);
    // Ascendant Phase 2: an Ascendant ally gets an Ascendant start base.
    else if(withAlly&&pid===nAI&&G.allyRace==='ascendant') mStartBaseAsc(bp.x,bp.y,mirrored,pid);
    else if(withAlly&&pid===nAI&&G.allyRace==='swarm') mStartBaseSwarm(bp.x,bp.y,mirrored,pid);
    // Ascendant enemy AI: Ascendant enemies warp in an Ascendant start base.
    else if(pid>=1&&pid<=nEnemies&&(G.enemyRaces[pid-1]||'concord')==='ascendant') mStartBaseAsc(bp.x,bp.y,mirrored,pid);
    else if(pid>=1&&pid<=nEnemies&&(G.enemyRaces[pid-1]||'concord')==='swarm') mStartBaseSwarm(bp.x,bp.y,mirrored,pid);
    else mStartBase(bp.x,bp.y,220,0,4,pid,mirrored);
  }
  // Personalities: 1v2 = aggressor+turtler, 1v3 adds an expander, 2v2 ally is balanced.
  const persPool=['aggressor','turtler','expander','balanced'];
  let pi=0;
  for(let i=1;i<=nAI;i++){
    const isAllyPlayer=withAlly&&i===nAI;
    AI[i].personality=isAllyPlayer?'balanced':(nAI===1?'balanced':persPool[pi++%persPool.length]);
  }
  G.war={ enemies:nEnemies, ally:withAlly };
  G.objectiveText='Raze every enemy base!';
  updateFog(); centerOn(G.basePos[PID].x*TILE, G.basePos[PID].y*TILE);
  flashHint(withAlly?'WAR 2v2 — your ally builds beside you. Raze the enemy bases!'
                    :'WAR 1v'+nEnemies+' — every enemy builds a base. Strike before they grow bold!');
}
function warUpdate(dt){
  // Win: EVERY enemy-team member eliminated — no enemy buildings AND no enemy
  // units left. Killing one enemy in a 2v2/1v3 does not end it (Bud 2026-10-11).
  const enemyAlive=G.buildings.some(b=>!b.dead&&isEnemy(b.owner,PID));
  const enemyUnits=G.units.some(u=>!u.dead&&isEnemy(u.owner,PID));
  if(!enemyAlive&&!enemyUnits&&!G.over){
    G.over='win'; AudioSys.blip(523,1046,0.8,'square',0.5);
  }
  // Lose: the WHOLE player side (player + ally) must be wiped — one fallen
  // teammate doesn't end it while the other still fights (Bud 2026-10-11).
  const sideAlive=G.players.some(pl=>(G.team[pl.id]||0)===0&&(
    G.buildings.some(b=>!b.dead&&b.owner===pl.id)||G.units.some(u=>!u.dead&&u.owner===pl.id)));
  const sideOre=G.players.reduce((s,pl)=>s+((G.team[pl.id]||0)===0?pl.ore:0),0);
  if(!sideAlive&&sideOre<50&&!G.over){ G.over='lose'; AudioSys.blip(330,110,0.8,'sawtooth',0.5); }
}

}

// Enemy base in a compass direction from the player's base (top/bottom/left/right), or nearest to mid.
function enemyBaseInDir(dir){
  const pb=G.basePos[PID]; if(!pb) return null;
  const px=pb.x*TILE, py=pb.y*TILE;
  const foes=G.players.filter(pl=>pl.isAI&&isEnemy(pl.id,PID)&&G.buildings.some(b=>!b.dead&&b.owner===pl.id)&&G.basePos[pl.id]);
  if(!foes.length) return null;
  if(dir==='mid'){
    const cx=MAP_W*TILE/2, cy=MAP_H*TILE/2;
    let best=null,bd=1e18;
    for(const pl of foes){ const bp=G.basePos[pl.id];
      const d=Math.hypot(bp.x*TILE-cx,bp.y*TILE-cy); if(d<bd){ bd=d; best=pl; } }
    return best;
  }
  let best=null,bd=1e18;
  for(const pl of foes){ const bp=G.basePos[pl.id];
    const dx=bp.x*TILE-px, dy=bp.y*TILE-py;
    const dd=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'bottom':'top');
    if(dd!==dir) continue;
    const d=Math.hypot(dx,dy); if(d<bd){ bd=d; best=pl; }
  }
  return best;
}

// Static defenses shoot back.
function updateBuildingCombat(b, dt){
  if(b.dead||b.progress<1||!b.def.dmg) return;
  if(b.type==='bunker'&&(!b.cargo||!b.cargo.length)) return;
  b.cooldown=(b.cooldown===undefined?0:b.cooldown)-dt;
  if(b.cooldown>0) return;
  const r=b.def.range*TILE;
  let best=null, bd=r*r;
  const us=unitsNear(b.cx,b.cy,r,e=>isEnemy(e.owner,b.owner)&&canHit(b,e)&&stealthDetectedBy(b.owner,e));
  for(const e of us){ const d=dist2(b.cx,b.cy,e.x,e.y); if(d<bd){ bd=d; best=e; } }
  if(best){
    b.cooldown=b.def.cd;
    b.aimAngle=Math.atan2(best.y-b.cy, best.x-b.cx); // gun tracks target
    fireWeapon(b,best);
  }
}

/* --------- B2. Win/loss records + medals (localStorage, Bud's request) ----- */
const MEDALS=[
  {id:'first_win', icon:'🏅', name:'First Victory', desc:'Win your first battle'},
  {id:'veteran',   icon:'⭐', name:'Veteran',       desc:'Win 10 battles'},
  {id:'flawless',  icon:'🛡️', name:'Flawless',       desc:'Win without losing a building'},
  {id:'blitz',     icon:'⚡', name:'Blitz',          desc:'Win a battle in under 10 minutes'},
  {id:'legend',    icon:'👑', name:'Legend',         desc:'Win 25 battles'},
];
const Records={
  key:'starfall_records_v1',
  data:null,
  load(){
    if(this.data) return this.data;
    let d=null; try{ d=JSON.parse(localStorage.getItem(this.key)||'null'); }catch(e){}
    if(!d||typeof d!=='object') d={};
    if(!d.modes||typeof d.modes!=='object') d.modes={};
    for(const m of ['skirmish','campaign','survival','war'])
      if(!d.modes[m]||typeof d.modes[m]!=='object') d.modes[m]={w:0,l:0};
    if(!Array.isArray(d.medals)) d.medals=[];
    this.data=d; return d;
  },
  save(){ try{ localStorage.setItem(this.key, JSON.stringify(this.data)); }catch(e){} },
  wl(mode){ const d=this.load(); return d.modes[mode]||{w:0,l:0}; },
  totalWins(){ const d=this.load(); let s=0; for(const m of Object.values(d.modes)) s+=(m.w||0); return s; },
  hasMedal(id){ return this.load().medals.indexOf(id)>=0; },
  // Record a finished game. Returns an array of newly-earned medal defs.
  record(mode, win, stats){
    const d=this.load();
    const rec=d.modes[mode]||(d.modes[mode]={w:0,l:0});
    if(win) rec.w++; else rec.l++;
    const fresh=[];
    const award=id=>{
      if(d.medals.indexOf(id)<0){ d.medals.push(id);
        const m=MEDALS.find(x=>x.id===id); if(m) fresh.push(m); }
    };
    if(win){
      const tw=this.totalWins();
      if(tw>=1) award('first_win');
      if(tw>=10) award('veteran');
      if(tw>=25) award('legend');
      if((stats.bLost||0)===0) award('flawless');
      if((stats.time||0)<600) award('blitz');
    }
    this.save();
    return fresh;
  },
};

function wrapText(text,x,y,maxW,lh){
  ctx.font='16px "Segoe UI",Verdana,sans-serif'; ctx.fillStyle='#dfeaff'; ctx.textAlign='left';
  const words=text.split(' '); let line='', yy=y;
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){ ctx.fillText(line,x,yy); line=w; yy+=lh; }
    else line=t;
  }
  if(line) ctx.fillText(line,x,yy);
  return yy+lh;
}

function handleScreenClick(x,y){
  if(G.screen==='title'){
    for(const b of (G.titleButtons||[])) if(hitButton(b,x,y)){
      AudioSys.select();
      if(b.id==='continue'){ if(!loadGame()) flashHint('Save file was corrupted — starting fresh'); return; }
      if(b.id==='campaign'){ G.screen='missions'; }
      else if(b.id==='survival'){ G.screen='survmenu'; }
      else if(b.id==='skirmish'){ G.screen='skirmmenu'; }
      else { setupScenario(); }
      return;
    }
  } else if(G.screen==='skirmmenu'){
    for(const b of (G.skirmButtons||[])) if(hitButton(b,x,y)){
      AudioSys.select();
      if(b.id==='back'){ G.screen='title'; return; }
      if(b.id==='random'){ G.chosenMap=null; setupScenario(); return; }
      const m=b.id.match(/^map:(.+)$/);
      if(m){ G.chosenMap=m[1]; setupScenario(); return; }
    }
  } else if(G.screen==='survmenu'){
    for(const b of (G.survButtons||[])) if(hitButton(b,x,y)){
      AudioSys.select();
      if(b.id==='back'){ G.screen='title'; return; }
      if(b.id==='waves'){ setupSurvival(); return; }
      if(b.id==='diff'){
        const order=['easy','normal','hard'];
        G.warDiff=order[(order.indexOf(G.warDiff||'normal')+1)%3];
        AudioSys.select(); return;
      }
      const m=b.id.match(/^war(\d)(a?)$/);
      // Ascendant Phase 2: war setup now goes through the race-select screen.
      if(m){ G.pendingWar={enemies:parseInt(m[1]), ally:m[2]==='a'};
        G.raceSel={race:'concord', allyRace:'concord', allySkill:'regular',
          enemyRaces:Array.from({length:parseInt(m[1])},()=>'concord')};
        G.raceScroll=0; G.raceContentH=0;
        G.screen='racesel'; return; }
    }
  } else if(G.screen==='racesel'){
    for(const b of (G.raceButtons||[])) if(hitButton(b,x,y)){
      AudioSys.select();
      const rs=G.raceSel;
      if(b.id==='back'){ G.screen='survmenu'; return; }
      let mm=b.id.match(/^race:(.+)$/); if(mm){ rs.race=mm[1]; return; }
      mm=b.id.match(/^allyrace:(.+)$/); if(mm){ rs.allyRace=mm[1]; return; }
      mm=b.id.match(/^allyskill:(.+)$/); if(mm){ rs.allySkill=mm[1]; return; }
      mm=b.id.match(/^enemyrace:(\d+):(.+)$/); if(mm){ rs.enemyRaces=rs.enemyRaces||[];
        rs.enemyRaces[parseInt(mm[1])]=mm[2]; return; }
      if(b.id==='launch'){ setupWar(G.pendingWar.enemies, G.pendingWar.ally); return; }
    }
  } else if(G.screen==='missions'){
    for(const b of (G.mselButtons||[])) if(hitButton(b,x,y)){
      AudioSys.select();
      if(b.id==='back'){ G.screen='title'; return; }
      if(b.id==='ep1'){ G.episode=1; return; }
      if(b.id==='ep2'&&CampaignProg.ep2open){ G.episode=2; return; }
      if(b.id==='ep3'&&CampaignProg.ep3open){ G.episode=3; return; }
      const m=b.id.match(/^m(\d)$/);
      if(m){
        const i=parseInt(m[1]);
        const un=G.episode===3?CampaignProg.unlocked3:(G.episode===2?CampaignProg.unlocked2:CampaignProg.unlocked);
        if(i<=un){ G.mselIdx=i; G.screen='briefing'; }
      }
      return;
    }
  } else if(G.screen==='briefing'){
    for(const b of (G.briefButtons||[])) if(hitButton(b,x,y)){
      AudioSys.select();
      if(b.id==='begin') startMission(G.mselIdx);
      else G.screen='missions';
      return;
    }
  }
}

function genMissionMap(cfg){
  mapTiles.fill(0); blocked.fill(0); elev.fill(0);
  for(let i=0;i<MAP_W*MAP_H;i++) shade[i]=randi(0,3);
  const rocks=cfg.rocks===undefined?18:cfg.rocks;
  for(let i=0;i<rocks;i++) setRockCluster(randi(8,MAP_W-9),randi(8,MAP_H-9),randi(2,4));
  for(const p of (cfg.pads||[]))
    for(let y=p.y-p.r;y<=p.y+p.r;y++) for(let x=p.x-p.r;x<=p.x+p.r;x++)
      if(inMap(x,y)){ mapTiles[tIdx(x,y)]=0; blocked[tIdx(x,y)]=0; }
  for(const [tx,ty,n] of (cfg.ores||[])) addOreField(tx,ty,n);
  for(const [tx,ty] of (cfg.flux||[])) addFluxGeyser(tx,ty);
  buildMinimapTerrain();
  G.basePos=[{x:cfg.playerBase[0],y:cfg.playerBase[1]},{x:cfg.enemyBase[0],y:cfg.enemyBase[1]}];
}

    const cc=G.buildings.find(b=>!b.dead&&b.owner===PID&&b.type==='command');
    if(!hs||!cc){ flashHint('A command center has fallen!'); mLose(); return; }
    const vossAlive=G.units.some(u=>!u.dead&&u.name==='Marshal Voss');
    if(!vossAlive&&!F.vossDead){ F.vossDead=true; flashHint('Marshal Voss has fallen... but the line holds!'); }
    F.holdT-=dt;
    G.m.timer=F.holdT; G.m.timerText='HOLD TOGETHER';
    G.objectiveText='Hold together — '+fmtTime(F.holdT)+' remaining';
    F.waveT-=dt;
    if(F.waveT<=0){
      F.waveNum++; F.waveT=Math.max(40,70-F.waveNum*3);
      const comp=[];
      const n=5+F.waveNum*2;
      for(let i=0;i<n;i++) comp.push('skitter');
      for(let i=0;i<F.waveNum;i++) comp.push('spitter');
      if(F.waveNum>=2) for(let i=0;i<Math.floor(F.waveNum/2);i++) comp.push('mauler');
      if(F.waveNum>=3) for(let i=0;i<F.waveNum-1;i++) comp.push('harpy');
      if(F.waveNum>=4) comp.push('mauler','mauler');
      if(F.waveNum>=6) for(let i=0;i<3;i++) comp.push('harpy');
      mWave(comp,60+(F.waveNum%2?30:-30),20,60,95);
      if(F.waveNum%3===0) flashHint('⚠ The Swarm throws everything at the alliance!');
    }
    if(F.holdT<=0){ mObj(0); mObj(1); mObj(2); mWin3(); }
    if(!mPlayerUnitsAlive()&&!mPlayerBuildingsAlive()) mLose();
  },
},

/* ---------------- G. Mission lifecycle ------------------------------------- */
function startMission(i){
  clearSave(); resetState(); maybeShowInstallHint();
  G.mode='campaign'; G.mIdx=i; G.screen='game'; G.running=true; G.over=null;
  if(G.episode===undefined) G.episode=1;
  const M=(G.episode===3?MISSIONS3:(G.episode===2?MISSIONS2:MISSIONS))[i];
  G.m={def:M,t:0,timer:0,timerText:'',flags:{},objState:M.objectives.map(()=>false)};
  G.objectiveText=M.name;
  M.setup();
  updateFog();
}
function renderMissionHUD(){
  const m=G.m; if(!m) return;
  ctx.textAlign='left'; ctx.font='13px "Segoe UI",Verdana,sans-serif';
  let y=68;
  m.def.objectives.forEach((o,i)=>{
    const done=m.objState[i];
    ctx.fillStyle=done?'rgba(61,255,94,0.85)':'rgba(230,240,255,0.9)';
    ctx.fillText((done?'✓ ':'• ')+o, 12, y); y+=18;
  });
  if(m.timer>0){
    ctx.textAlign='center'; ctx.font='bold 26px "Segoe UI",Verdana,sans-serif';
    ctx.fillStyle='#ffd76a';
    ctx.fillText((m.timerText?m.timerText+' ':'')+fmtTime(m.timer), VW/2, 88);
    ctx.textAlign='left';
  }
  if(m.flags.zone){
    const z=m.flags.zone;
    const a=worldToScreen(z.x0*TILE,z.y0*TILE), b=worldToScreen(z.x1*TILE,z.y1*TILE);
    ctx.fillStyle='rgba(61,255,94,0.14)'; ctx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);
    ctx.strokeStyle='#3dff5e'; ctx.lineWidth=2; ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
    ctx.fillStyle='#3dff5e'; ctx.font='bold 14px "Segoe UI",Verdana,sans-serif'; ctx.textAlign='center';
    ctx.fillText(z.label||'EVAC', (a.x+b.x)/2, a.y-10); ctx.textAlign='left';
  }
}
function handleEndScreenClick(x,y){
  for(const b of (G.endButtons||[])) if(hitButton(b,x,y)){
    if(b.id==='next'){
      const nxt=Math.min(9,G.mIdx+1);
      // Stay in same episode for next mission
      startMission(nxt);
    }
    else if(b.id==='again') playAgain();
    else endMenuMain();
    return true;
  }
  return false;
}
/* ------------------------------ Autosave (Bud request) ---------------------
   Saves the full game state to localStorage every 30s and when the page is
   hidden/closed, so an accidental swipe away never loses progress. */
const SAVE_KEY='starfall_autosave_v1';
function refId(e){ return (e&&!e.dead)?e.id:null; }
function saveOrd(o){
  if(!o) return {t:'idle'};
  const r={t:o.t};
  for(const k of ['x','y','x2','y2','btype','btx','bty','resourceType']) if(o[k]!==undefined) r[k]=o[k];
  if(o.target&&!o.target.dead) r.target=o.target.id;
  if(o.res&&o.res.amount>0) r.res=o.res.id;
  if(o.b&&!o.b.dead) r.b=o.b.id;
  return r;
}
function saveUnit(u){
  const o={};
  for(const k of ['id','type','owner','x','y','hp','maxhp','angle','cooldown','carry','carryType','gphase','healCooldown','stimT','kills','veteran','siege','deploying','dead','deathT','lastDmgT','skipSupply','homeX','homeY','repathT','scanT']) o[k]=u[k];
  o.ord=saveOrd(u.ord);
  o.path=u.path?u.path.map(p=>({x:p.x,y:p.y})):null;
  o.target=refId(u.target); o.gres=refId(u.gres); o.constructB=refId(u.constructB); o.repairB=refId(u.repairB);
  o.cargo=(u.cargo||[]).map(refId).filter(id=>id!==null);
  o.loadedBy=refId(u.loadedBy);
  o.bqueue=u.bqueue||null;
  return o;
}
function saveBuilding(b){
  const o={};
  for(const k of ['id','type','owner','btx','bty','cx','cy','hp','maxhp','progress','qprog','queue','research','researchProgress','nukeBuilding','nukeProgress','nukeReady','dead','ghostSeen','lastSeenX','lastSeenY','repeat','repeatType','wallLevel']) o[k]=b[k];
  o.rally=b.rally?{x:b.rally.x,y:b.rally.y}:null;
  o.cargo=(b.cargo||[]).map(c=>c.id);
  return o;
}
function saveGame(){
  if(!G.running||G.screen!=='game'||G.over) return false;
  try{
    const d={
      v:2, savedAt:Date.now(), // Bud 2026-10-11: v2 invalidates saves from the frozen-state bug
      mode:G.mode, mIdx:G.mIdx, time:G.time, tick:G.tick, nextId:G.nextId,
      warDiff:G.warDiff, team:G.team||{0:0,1:1}, objectiveText:G.objectiveText||'',
      players:G.players,
      units:G.units.filter(u=>!(u.dead&&u.deathT<=0)).map(saveUnit),
      buildings:G.buildings.filter(b=>!b.dead).map(saveBuilding),
      resources:G.resources,
      mapTiles:Array.from(mapTiles), blocked:Array.from(blocked), shade:Array.from(shade),
      fog:fog.map(f=>Array.from(f)),
      sel:G.sel.map(e=>e.id), groups:G.groups||{},
      basePos:G.basePos,
      AI:AI||{},
      surv:G.surv?JSON.parse(JSON.stringify(G.surv)):null,
      m:(G.m&&G.mIdx>=0)?{t:G.m.t,timer:G.m.timer,timerText:G.m.timerText,flags:G.m.flags,objState:G.m.objState}:null,
      cam:{x:cam.x,y:cam.y},
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
    return true;
  }catch(e){ return false; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function getSave(){
  try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)); return (d&&d.v===2)?d:null; }
  catch(e){ return null; }
}
function hasSave(){ return !!getSave(); }
function saveLabel(d){
  const mm=String(Math.floor(d.time/60)).padStart(2,'0'), ss=String(Math.floor(d.time%60)).padStart(2,'0');
  const modeName=d.mode==='campaign'&&d.mIdx>=0?('Mission '+(d.mIdx+1)):d.mode.charAt(0).toUpperCase()+d.mode.slice(1);
  return modeName+' '+mm+':'+ss;
}
function restoreOrd(o,byId){
  if(!o) return {t:'idle'};
  const r={t:o.t};
  for(const k of ['x','y','x2','y2','btype','btx','bty','resourceType']) if(o[k]!==undefined) r[k]=o[k];
  if(o.target){ const t=byId(o.target); if(t&&!t.dead) r.target=t; }
  if(o.res){ const rs=byId(o.res); if(rs&&rs.amount>0) r.res=rs; else return {t:'idle'}; }
  if(o.b){ const b=byId(o.b); if(b&&!b.dead) r.b=b; else return {t:'idle'}; }
  return r;
}
function loadGame(){
  const d=getSave();
  if(!d) return false;
  resetState();
  try{
    mapTiles.set(d.mapTiles); blocked.set(d.blocked); shade.set(d.shade);
    d.fog.forEach((f,i)=>{ if(fog[i]&&f.length===fog[i].length) fog[i].set(f); });
  }catch(e){ return false; }
  G.mode=d.mode; G.mIdx=d.mIdx; G.time=d.time; G.tick=d.tick; G.nextId=d.nextId;
  G.warDiff=d.warDiff; G.team=d.team||{0:0,1:1}; G.objectiveText=d.objectiveText||'';
  G.players=d.players;
  while(fog.length<G.players.length) fog.push(new Uint8Array(MAP_W*MAP_H));
  G.basePos=d.basePos;
  G.resources=d.resources||[];
  AI=d.AI||{};
  for(const pl of G.players) if(pl.isAI&&!AI[pl.id]) aiInitState(pl.id);
  if(d.surv) G.surv=d.surv;
  if(d.mode==='campaign'&&d.mIdx>=0&&d.m){ const ML=(d.episode===3||G.episode===3)?MISSIONS3:((d.episode===2||G.episode===2)?MISSIONS2:MISSIONS); const M=ML[d.mIdx]; if(M) G.m={def:M,t:d.m.t,timer:d.m.timer,timerText:d.m.timerText,flags:d.m.flags,objState:d.m.objState}; }
  const idMap=new Map();
  for(const ru of d.units){
    const u=Object.assign({},ru);
    u.kind='unit'; u.def=unitDef(ru.type);
    u.path=ru.path||null; u.ord={t:'idle'};
    u.target=null; u.gres=null; u.constructB=null; u.repairB=null; u.loadedBy=null;
    u.cargo=[]; u.bqueue=ru.bqueue||null;
    G.units.push(u); idMap.set(ru.id,u);
  }
  for(const rb of d.buildings){
    const b=Object.assign({},rb);
    b.kind='building'; b.def=bldDef(rb.type);
    if(rb.type==='wall'&&rb.wallLevel>1){ // restore upgraded wall tier (name + hp)
      const up=WALL_TIERS[rb.wallLevel];
      if(up) b.def=Object.assign({}, BDEF.wall, {name:up.name, hp:up.hp});
    }
    b.rally=rb.rally||null; b.queue=rb.queue||[]; b.cargo=[];
    G.buildings.push(b); idMap.set(rb.id,b);
  }
  const byId=id=>idMap.get(id)||null;
  d.units.forEach((ru,i)=>{
    const u=G.units[i]; if(!u) return;
    u.ord=restoreOrd(ru.ord,byId);
    u.target=byId(ru.target); u.gres=byId(ru.gres); u.constructB=byId(ru.constructB); u.repairB=byId(ru.repairB);
    u.cargo=(ru.cargo||[]).map(byId).filter(e=>e&&!e.dead);
    u.loadedBy=byId(ru.loadedBy);
  });
  d.buildings.forEach((rb,i)=>{
    const b=G.buildings[i]; if(!b) return;
    b.cargo=(rb.cargo||[]).map(byId).filter(e=>e&&!e.dead);
  });
  G.sel=(d.sel||[]).map(id=>idMap.get(id)).filter(e=>e&&!e.dead);
  G.groups=d.groups||{};
  if(d.cam){ cam.x=d.cam.x; cam.y=d.cam.y; clampCam(); }
  G.screen='game'; G.running=true; G.over=null; G.paused=false;
  buildMinimapTerrain(); updateFog();
  flashHint('Save restored — welcome back, Marshal');
  return true;
}
// Autosave triggers: every 90s + when the page is hidden/closed (Bud: swipe-away protection).
// (Was 30s — the stringify caused a visible hitch on iPhones in long games.)
setInterval(()=>{ saveGame(); },90000);
window.addEventListener('pagehide',()=>{ saveGame(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveGame(); });
</script>
